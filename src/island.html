<title>Xavier's Island</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Tilt+Neon&family=VT323&display=swap">
<style>
/* Layout: a floating neon sky-island you pan around. The HUD is in-world signage: a neon-tube title with an LED ticker,
   a neon switch, a holo console for quick-add, and neon-framed building panels. One committed night look. */
:root{
  color-scheme:dark;
  --ink:#f1ecff; --ink-2:#b4aad8; --ink-3:#7d74a6;
  --panel:#0e0b1f; --panel-2:#1a1534; --line:#2f2752; --wire:#3b3166;
  --pink:#ff4fa8; --cyan:#35e6ff; --violet:#b46cff; --amber:#ffc83d; --lime:#7dff6a;
  --accent:#ff4fa8; --accent-ink:#1d0414; --alert:#ff6a86; --focus:#35e6ff;
  --c-academic:#5aa8ff; --c-fitness:#ff4f9a; --c-daily:#ffc83d; --c-misc:#3fffc8; --c-idea:#ffe14d;
  --g-barca:#edbb00; --g-spain:#ff4f5e; --g-dispatch:#ffc83d; --g-news:#ff4fa8; --g-studio:#ff8a3d; --g-habits:#5dffb0; --g-cw:#7dff6a; --g-focus:#35e6ff;
  --b-studio:#ff8a3d; --b-news:#ff4fa8;
  --b-todo:#35e6ff; --b-cal:#ff4fa8; --b-mail:#b46cff; --b-ideas:#ffe14d;
  --g-todo:#35e6ff; --g-cal:#ff4fa8; --g-mail:#b46cff; --g-ideas:#ffe14d;
  --bg:#0a0820;
  --f-neon:"Tilt Neon","Chakra Petch",system-ui,sans-serif;
  --f-display:"Chakra Petch","Eurostile","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --f-led:"VT323","IBM Plex Mono",ui-monospace,monospace;
  --qh:122px;
  --cut:14px;
}
[hidden]{display:none!important} /* the host page may not ship this rule; without it the empty panel covered the map */
html,body{height:100%}
body{-webkit-user-select:none;user-select:none;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
input,textarea,#sheet .inner{-webkit-user-select:text;user-select:text}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.cham{clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut))}

/* ---------- scene ---------- */
#world{position:fixed;inset:0;overflow:hidden;background:linear-gradient(180deg,var(--sk0,#0a0820),var(--sk1,#1c1442) 55%,var(--sk2,#36245e))}
#stage{position:absolute;inset:0;touch-action:none;cursor:grab;overflow:hidden;transition:filter .35s ease;-webkit-user-select:none;user-select:none}
#stage.dragging{cursor:grabbing}
#cam{position:absolute;inset:0;transform-origin:0 0;will-change:transform}
.lyr{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
#sceneBack,#sceneFront{pointer-events:none;will-change:transform} /* own layers: their ambient motion never repaints the island */
.hit{fill:transparent}
/* the island layer is kept still so it can be cached; only a few cheap step-blinks remain on it */
#scene .pulse,#scene .flow,#scene .scan,#scene .bob,#scene .twinkle,#scene .drift,#scene .fall,#scene .spinP{animation:none}
#stage.moving .lyr *{animation-play-state:paused!important}
.o{stroke:#0b0818;stroke-width:1.2;stroke-linejoin:round;stroke-linecap:round}
.on{stroke:#0b0818;stroke-width:1.1;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.lit{opacity:var(--lights,1);transition:opacity 1.5s}
.cl{fill:var(--cloud,#2b2552)}
.clh{fill:var(--cloudHi,#3d3570)}
.bldg{cursor:pointer}
#scene g.lit > ellipse,#scene g.lit > circle[opacity]{pointer-events:none}
.lhbeam{pointer-events:none;opacity:0;transition:opacity .8s}#scene.focusing .lhbeam{opacity:1}.lhcore{opacity:calc(var(--lights,1) * .55)}#scene.focusing .lhcore{opacity:1}
.bldg .hl{opacity:0;transition:opacity .2s}
.bldg.hot .hl{opacity:1}
.plot{cursor:pointer}
.ntxt{font-family:"Tilt Neon","Chakra Petch",sans-serif}
.bob{animation:bob 6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.blink{animation:blink 2.2s steps(1) infinite}
@keyframes blink{50%{opacity:.1}}
.flick{animation:flick 7s linear infinite}
@keyframes flick{0%,60%,63%,66%,100%{opacity:1}61.5%,64.5%{opacity:.25}}
.scan{animation:scan 3s linear infinite}
@keyframes scan{from{transform:translateY(0)}to{transform:translateY(14px)}}
.pulse{animation:pls 2.6s ease-in-out infinite}
@keyframes pls{50%{opacity:.45}}
.twinkle{animation:tw 3.5s ease-in-out infinite}
@keyframes tw{50%{opacity:.3}}
.fall{animation:fall .9s linear infinite}
@keyframes fall{to{stroke-dashoffset:-40}}
.flow{animation:flow 1.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-.9}}
.drift{animation:drift 90s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(80px)}}
.spinP{transform-box:fill-box;transform-origin:center;animation:sp .25s linear infinite}
@keyframes sp{50%{transform:scaleX(.15)}}

/* hover tags + count pips: little neon signs */
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;border:1.5px solid var(--glow);border-radius:3px;padding:6px 14px 5px;background:rgba(8,6,20,.88);color:#fff;
  font:400 19px/1 var(--f-neon);letter-spacing:.06em;white-space:nowrap;cursor:pointer;text-align:center;
  text-shadow:0 0 2px #fff,0 0 8px var(--glow),0 0 16px var(--glow);
  box-shadow:0 0 0 1px rgba(0,0,0,.5),0 0 14px color-mix(in srgb,var(--glow) 55%,transparent),inset 0 0 10px color-mix(in srgb,var(--glow) 25%,transparent);
  opacity:0;scale:.85;pointer-events:none;transition:opacity .16s,scale .2s cubic-bezier(.3,1.6,.5,1);will-change:transform}
.lbl small{display:block;margin-top:3px;font:400 16px/1 var(--f-led);letter-spacing:.04em;text-shadow:0 0 6px var(--glow);color:var(--glow)}
.lbl.show,.lbl.sel,.lbl:focus-visible{opacity:1;scale:1}
.lbl::after{content:"";position:absolute;left:50%;bottom:-12px;width:1.5px;height:10px;margin-left:-.75px;background:var(--glow);box-shadow:0 0 6px var(--glow)}
.pip{position:absolute;left:0;top:0;min-width:24px;height:24px;padding:0 6px;display:grid;place-items:center;font:400 20px/1 var(--f-led);color:#fff;
  background:#e8235f;border:1.5px solid #ffd1e0;border-radius:3px;box-shadow:0 0 14px rgba(255,40,100,.9);pointer-events:none;transition:opacity .2s}
.pip[hidden]{display:none}

/* map controls */
.mapctl{position:fixed;z-index:22;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(var(--qh) + 12px);display:grid;gap:6px}
.mapctl button{width:40px;height:40px;border-radius:2px;border:1px solid var(--wire);background:rgba(10,8,28,.82);display:grid;place-items:center;cursor:pointer;color:var(--cyan);filter:drop-shadow(0 0 4px rgba(53,230,255,.5))}
.mapctl button:hover{border-color:var(--cyan);box-shadow:0 0 12px rgba(53,230,255,.45)}
@media (max-width:720px){.mapctl{display:none}}

/* ---------- HUD top: neon title + LED ticker + neon switch ---------- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:19;background:var(--bg)}
.hud-top{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
  padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.sign{pointer-events:auto;display:grid;gap:4px;min-width:0}
.sign .t{font:400 32px/1 var(--f-neon);color:#fff0fb;letter-spacing:.03em;white-space:nowrap;
  text-shadow:0 0 2px #fff,0 0 7px #ff4fa8,0 0 16px #ff4fa8,0 0 32px #ff2f8f,0 2px 0 rgba(0,0,0,.6)}
.sign .t em{font-style:normal;color:#eafdff;text-shadow:0 0 2px #fff,0 0 7px #35e6ff,0 0 16px #35e6ff,0 0 32px #1fb8ff,0 2px 0 rgba(0,0,0,.6)}
.sign .t .flk{animation:tube 7s linear infinite}
@keyframes tube{0%,70%,72%,75%,100%{opacity:1}71%,73.5%{opacity:.2}}
.ticker{display:inline-flex;gap:10px;align-items:center;font:400 20px/1 var(--f-led);color:var(--amber);letter-spacing:.08em;text-shadow:0 0 6px rgba(255,200,61,.65);padding:3px 8px 2px;background:rgba(10,8,28,.7);border:1px solid #3a2f12;border-radius:2px;width:max-content}
.ticker i{width:6px;height:6px;border-radius:50%;background:var(--lime);box-shadow:0 0 6px var(--lime);animation:blink 2s steps(1) infinite}
.plate{pointer-events:auto;padding:1px;background:linear-gradient(90deg,rgba(53,230,255,.7),rgba(255,79,168,.7));--cut:10px}
.plate>.in{background:rgba(10,8,28,.9);--cut:10px}
.switch{display:flex;align-items:center;padding:3px 6px}
.switch i{width:1.5px;height:20px;background:var(--wire)}
.switch button{border:0;background:none;padding:6px 12px 5px;font:400 21px/1 var(--f-neon);letter-spacing:.06em;color:#4f4677;cursor:pointer;transition:color .2s,text-shadow .2s}
.switch button:hover{color:#8c80bd}
.switch button[aria-pressed="true"]{color:#eafdff;text-shadow:0 0 2px #fff,0 0 8px #35e6ff,0 0 18px #35e6ff}
@media (max-width:440px){.sign .t{font-size:24px}.ticker{font-size:17px}.switch button{font-size:18px;padding:5px 8px}}

/* ---------- quick-add: a holo console ---------- */
#quick{position:fixed;left:0;right:0;bottom:0;z-index:30;pointer-events:none;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.qglow{pointer-events:auto;max-width:740px;margin:0 auto;filter:drop-shadow(0 0 8px rgba(255,79,168,.4)) drop-shadow(0 0 22px rgba(53,230,255,.18))}
.qframe{padding:1.5px;background:linear-gradient(100deg,#35e6ff,#b46cff 50%,#ff4fa8)}
.qcard{position:relative;background:linear-gradient(180deg,rgba(22,15,48,.97),rgba(9,7,24,.97));padding:10px 10px 9px;display:grid;grid-template-columns:minmax(0,1fr);gap:9px}
.qcard::after,.inner::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px)}
.qrow{display:flex;gap:8px}
.field{flex:1;min-width:0;padding:1px;background:var(--wire);--cut:9px;transition:background .2s}
.field:focus-within{background:linear-gradient(90deg,var(--cyan),var(--violet))}
.field>div{display:flex;align-items:center;background:#07061a;--cut:9px;height:100%}
.prompt{padding:0 4px 0 12px;font:400 26px/1 var(--f-led);color:var(--cyan);text-shadow:0 0 8px var(--cyan)}
#qInput{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:500 16px var(--f-body);padding:12px 12px 12px 4px;outline:none}
#qInput::placeholder{color:#6a6196}
.btn-go{flex:none;--cut:9px;border:0;padding:0 22px;cursor:pointer;font:700 15px var(--f-display);letter-spacing:.22em;text-transform:uppercase;color:var(--accent-ink);
  background:linear-gradient(180deg,#ffa0d8,#ff4fa8 55%,#e02f8a);transition:filter .15s}
.btn-go:hover{filter:brightness(1.12) saturate(1.1)}
.btn-go:active{filter:brightness(.92)}
.qmeta{display:flex;align-items:center;gap:10px;min-width:0}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;--cut:6px;font:600 12px var(--f-display);letter-spacing:.12em;text-transform:uppercase;padding:6px 10px 5px;border:0;
  background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px var(--wire);color:#8f86b8;display:inline-flex;align-items:center;gap:7px;cursor:pointer;white-space:nowrap;border-radius:2px}
.chip:hover{color:var(--ink)}
.chip .dot{width:7px;height:7px;rotate:45deg;background:var(--c,#8f86b8);box-shadow:0 0 6px var(--c,transparent)}
.chip[aria-checked="true"]{color:#fff;background:color-mix(in srgb,var(--c,var(--cyan)) 18%,transparent);box-shadow:inset 0 0 0 1px var(--c,var(--cyan)),0 0 10px color-mix(in srgb,var(--c,var(--cyan)) 40%,transparent);text-shadow:0 0 8px var(--c,var(--cyan))}
.chip .n{font:400 16px/1 var(--f-led);letter-spacing:0;color:var(--ink-3)}
#qHint{font:400 18px/1 var(--f-led);color:var(--amber);text-shadow:0 0 6px rgba(255,200,61,.5);white-space:nowrap;flex:none;letter-spacing:.03em}
#qHint b{color:#fff;font-weight:400}
@media (max-width:600px){.qmeta{flex-direction:column;align-items:stretch;gap:6px}#qHint{white-space:normal;min-height:1.1em}}

/* ---------- building panel: a neon-framed screen ---------- */
#sheet{position:fixed;z-index:25;top:calc(env(safe-area-inset-top,0px) + 92px);right:max(16px,env(safe-area-inset-right,0px));bottom:calc(var(--qh) + 8px);
  width:min(440px,calc(100vw - 32px));display:flex;filter:drop-shadow(0 0 10px color-mix(in srgb,var(--c) 45%,transparent));animation:sheetIn .24s cubic-bezier(.2,1.2,.4,1)}
#sheet.wide{right:auto;left:50%;transform:translateX(-50%);width:min(760px,calc(100vw - 32px))}
#sheet .frame{flex:1;display:flex;min-height:0;min-width:0;width:100%;padding:1.5px;--cut:18px;background:linear-gradient(160deg,var(--c),color-mix(in srgb,var(--c) 30%,#2f2752) 35%,#2f2752 65%,var(--c))}
#sheet .inner{position:relative;flex:1;display:flex;flex-direction:column;min-height:0;min-width:0;--cut:18px;background:linear-gradient(180deg,#151030,#0a0820)}
@keyframes sheetIn{from{translate:0 14px;opacity:0}to{translate:0 0;opacity:1}}
@media (min-width:721px){#app.sheet-open:not(.wide-open) #stage{right:calc(min(440px,100vw - 32px) + 20px)}}
#app.wide-open #stage{filter:saturate(.7) brightness(.5)}
@media (max-width:720px){
  #sheet,#sheet.wide{top:calc(env(safe-area-inset-top,0px) + 34vh);left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));width:auto;transform:none}
  #sheet.wide{top:calc(env(safe-area-inset-top,0px) + 92px)}
  .lbl.sel{opacity:0;pointer-events:none}
}
.sh-head{display:flex;align-items:center;gap:12px;padding:16px 14px 12px 20px;border-bottom:1px solid var(--line);position:relative;z-index:1}
.sh-icon{flex:none;width:42px;height:42px;display:grid;place-items:center;color:var(--c);border:1.5px solid var(--c);border-radius:2px;box-shadow:0 0 10px color-mix(in srgb,var(--c) 45%,transparent),inset 0 0 10px color-mix(in srgb,var(--c) 30%,transparent);filter:drop-shadow(0 0 4px var(--c))}
.sh-title{font:400 32px/1 var(--f-neon);color:#fff;letter-spacing:.03em;text-shadow:0 0 2px #fff,0 0 8px var(--c),0 0 20px var(--c)}
.sh-sub{font:400 18px/1 var(--f-led);color:var(--ink-2);margin-top:5px;letter-spacing:.04em}
.icon-btn{margin-left:auto;flex:none;width:36px;height:36px;border-radius:2px;border:1px solid var(--wire);background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.icon-btn:hover{color:#fff;border-color:var(--c);box-shadow:0 0 10px color-mix(in srgb,var(--c) 40%,transparent)}
.sh-body{position:relative;z-index:1;flex:1;min-height:0;overflow:auto;padding:12px 16px 22px;overscroll-behavior:contain;scrollbar-color:var(--wire) transparent}

/* lists */
ul{list-style:none;margin:0;padding:0}
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 6px}
.grp{margin-top:12px}
.grp-h{display:flex;align-items:baseline;gap:8px;font:700 12px var(--f-display);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);padding:0 6px 4px}
.grp-h.over{color:var(--alert);text-shadow:0 0 8px rgba(255,106,134,.6)}
.grp-h .n{font:400 17px/1 var(--f-led);letter-spacing:0}
.item{display:grid;grid-template-columns:28px minmax(0,1fr);align-items:start;gap:10px;padding:9px 8px;border-radius:2px;border-left:2px solid transparent}
.item:hover{background:rgba(255,255,255,.04);border-left-color:var(--c)}
.ck{margin-top:1px;width:22px;height:22px;border-radius:2px;border:1.5px solid var(--c);background:transparent;display:grid;place-items:center;cursor:pointer;padding:0;color:var(--c);box-shadow:0 0 8px color-mix(in srgb,var(--c) 40%,transparent)}
.ck svg{opacity:0;transition:opacity .15s}
.ck:hover svg{opacity:.5}
.item.done .ck{background:var(--c);color:#0a0820}
.item.done .ck svg{opacity:1}
.ttl{display:block;width:100%;background:none;border:0;text-align:left;font:500 15px/1.35 var(--f-body);color:var(--ink);cursor:pointer;padding:0;overflow-wrap:anywhere}
.item.done .ttl{text-decoration:line-through;color:var(--ink-3)}
.meta{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:5px;font-size:12px;color:var(--ink-2)}
.tag{display:inline-flex;align-items:center;gap:5px;padding:1px 7px;border-radius:2px;border:1px solid var(--line);font-weight:600;white-space:nowrap}
.tag.t{font:400 16px/1.1 var(--f-led);color:var(--amber);border-color:#3a2f12}
.tag.over{color:var(--alert);border-color:#5a1f30}
.tag.ex{border-style:dashed;border-color:var(--ink-3)}
.cat-dot{width:7px;height:7px;rotate:45deg;background:var(--c);box-shadow:0 0 6px var(--c)}
.ai{color:var(--cyan);display:inline-flex;filter:drop-shadow(0 0 4px var(--cyan))}
.edit{background:rgba(255,255,255,.035);border-radius:2px;padding:12px;margin:2px 0 8px;display:grid;gap:10px;border:1px solid var(--line);border-left:2px solid var(--cyan)}
.edit label{font:700 11px var(--f-display);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);display:grid;gap:5px}
.edit input{font:500 15px var(--f-body);padding:9px 11px;border-radius:2px;border:1px solid var(--wire);background:#07061a;color:var(--ink);min-width:0;width:100%}
.edit input:focus{outline:none;border-color:var(--cyan)}
.edit .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.edit .acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--wire);background:transparent;border-radius:2px;padding:7px 12px;font:600 12px var(--f-display);letter-spacing:.14em;text-transform:uppercase;cursor:pointer;color:var(--ink-2)}
.btn:hover{border-color:var(--cyan);color:#fff}
.btn.primary{background:var(--pink);border-color:var(--pink);color:var(--accent-ink);box-shadow:0 0 12px rgba(255,79,168,.45)}
.btn.danger{color:var(--alert)}
.btn.ghost{border-color:transparent}
.btn:disabled{opacity:.55;cursor:default}
.empty{padding:26px 10px;text-align:center;color:var(--ink-2);line-height:1.5}
.empty b{display:block;font:400 24px var(--f-neon);color:#fff;margin-bottom:6px;text-shadow:0 0 8px var(--c,var(--cyan))}
.done-toggle{margin-top:14px;width:100%;text-align:left;border:0;background:transparent;padding:8px 6px;font:700 12px var(--f-display);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);cursor:pointer}
.banner{font-size:13px;line-height:1.45;padding:10px 12px;border-radius:2px;background:rgba(255,200,61,.06);border:1px solid #3a2f12;border-left:2px solid var(--amber);margin-bottom:8px}
.sec-h{font:700 12px var(--f-display);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);margin:18px 6px 8px;display:flex;gap:8px;align-items:center}
.sec-h:first-child{margin-top:4px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.day{border-radius:2px;background:rgba(255,255,255,.035);padding:8px 2px;text-align:center;display:grid;gap:3px;justify-items:center;border:1px solid var(--line)}
.day.today{border-color:var(--b-cal);box-shadow:0 0 10px rgba(255,79,168,.35)}
.day small{font:700 11px var(--f-display);letter-spacing:.12em;color:var(--ink-3);text-transform:uppercase}
.day strong{font:400 24px/1 var(--f-led);color:#fff}
.dots{display:flex;gap:2px;min-height:6px}
.dots i{width:6px;height:6px;rotate:45deg;background:var(--c);box-shadow:0 0 5px var(--c)}
.trow{display:grid;grid-template-columns:70px minmax(0,1fr);gap:10px;padding:9px 6px;align-items:baseline;border-bottom:1px dashed var(--line)}
.trow time{font:400 18px/1 var(--f-led);color:var(--amber)}
.trow .t{overflow-wrap:anywhere}
.soon{border:1px dashed var(--wire);border-radius:2px;padding:14px;margin-top:18px}

.acct i{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}.acct.on{color:#fff;border-color:var(--c)}.acct.on i{background:var(--lime);box-shadow:0 0 6px var(--lime)}

.mini li span small{display:block;font-size:11.5px;color:var(--ink-3)}.mini a{color:var(--ink)}
.mail .sub{font-size:14px;margin-top:2px}
.mail .why{font-size:12.5px;color:var(--ink-2);margin-top:4px}

/* ---------- FC Barcelona panel: blaugrana + gold, Sofascore-style data ---------- */
#sheet.barca{filter:drop-shadow(0 0 10px rgba(165,0,68,.5)) drop-shadow(0 0 18px rgba(0,77,152,.35))}

.mlist{margin:0}
.mrow{display:grid;grid-template-columns:56px minmax(0,1fr) 26px 22px;gap:10px;align-items:center;padding:9px 6px;border-bottom:1px solid var(--line)}

.mwhen span{font:400 16px/1 var(--f-led);color:var(--ink-3)}

.mteams{display:grid;gap:4px;min-width:0}

.mteams .dim{color:var(--ink-3)}
.mscore{display:grid;gap:4px;text-align:right;margin-top:16px}
.mscore b{font:400 20px/1 var(--f-led);color:var(--ink-2);font-weight:400}
.mscore b.win{color:#fff}
.res{width:22px;height:22px;display:grid;place-items:center;border-radius:4px;font:700 11px var(--f-display);color:#fff}
.res.rW{background:#1fae5a}.res.rD{background:#7d7a96}.res.rL{background:#e0354b}.res.rn{background:transparent}
.form{display:flex;gap:6px;padding:0 6px}
.form .res{width:28px;height:28px;font-size:13px}
.sb{border:1px solid var(--line);border-radius:4px;padding:14px 12px 12px;background:linear-gradient(180deg,rgba(0,77,152,.22),rgba(165,0,68,.18));position:relative;overflow:hidden}

.sb-main{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-top:12px}
.sb-team{display:grid;justify-items:center;gap:7px;text-align:center;min-width:0}

.sb-mid{display:grid;justify-items:center;gap:6px}
.sb-score{font:400 54px/1 var(--f-led);color:#ffe14d;text-shadow:0 0 10px rgba(237,187,0,.7);letter-spacing:.04em}

.sb-score.dim{color:#6a6196;text-shadow:none}
.sb-score.vs{font-size:30px;color:#9fe8ff;text-shadow:0 0 8px rgba(53,230,255,.6)}
.st-live{font:700 11.5px var(--f-display);letter-spacing:.16em;color:#fff;background:#e0234a;padding:3px 8px;border-radius:3px;box-shadow:0 0 12px rgba(255,59,92,.6);animation:pls 1.6s ease-in-out infinite}
.st-ft{font:700 11.5px var(--f-display);letter-spacing:.16em;color:var(--ink-2);text-transform:uppercase}
.st-ns{font:400 17px/1 var(--f-led);color:var(--amber)}
.sb-note{margin:12px 0 0;text-align:center;font-size:12.5px;color:var(--ink-2)}
.evs{margin-top:12px;border-top:1px dashed var(--line);padding-top:8px;display:grid;gap:5px}
.evs li{display:grid;grid-template-columns:minmax(0,1fr) 50px minmax(0,1fr);gap:8px;align-items:center;font-size:13px}
.evs .ev{display:flex;align-items:center;gap:7px;min-width:0}.evs li.home .ev{grid-column:1;justify-content:flex-end;text-align:right}.evs li.away .ev{grid-column:3}
.evs .emin{grid-column:2;grid-row:1;text-align:center}
.emin{font:400 16px/1 var(--f-led);color:var(--amber)}
.eico{flex:none;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#bbb 60%,#777);box-shadow:0 0 0 1px #0a0820}
.eico.yellow{border-radius:2px;width:9px;height:12px;background:#ffd400}.eico.red{border-radius:2px;width:9px;height:12px;background:#e0234a}
.ename small{display:block;font-size:11.5px;color:var(--ink-3)}
.hint-row{margin:4px 6px 10px;font-size:13.5px;color:var(--ink-2);line-height:1.45}
.empty.sm{padding:14px 6px;font-size:13.5px}
.bars{display:grid;gap:12px;padding:2px 4px}
.bar .bl{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;font-size:12.5px;color:var(--ink-2);text-align:center}
.bar .bl b{font:400 18px/1 var(--f-led);color:var(--ink-2)}
.bar .bl b:first-child{text-align:left}.bar .bl b:last-child{text-align:right}
.bar .bl b.hi{color:#fff}
.bar .bt{display:flex;gap:4px;margin-top:5px;height:6px}
.bar .bt i{display:block;height:100%;border-radius:3px}
.bar .bt .h{background:#2f7dff;margin-left:auto}.bar .bt .a{background:#e0306e}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{border:1px solid var(--line);border-radius:4px;padding:10px 12px;background:rgba(255,255,255,.03);display:grid;gap:4px}
.tile small{font:600 10.5px var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.tile b{font:400 34px/1 var(--f-led);color:#fff;font-weight:400}
.tile b i{font-style:normal;color:var(--ink-3);margin:0 2px}
.tile b sup{font-size:16px;color:var(--ink-2)}
.tile span{font-size:12px;color:var(--ink-2)}
.tile:first-child{border-color:#edbb00;box-shadow:inset 0 0 14px rgba(237,187,0,.15)}
.facts li+li{margin-top:5px}
.facts{list-style:disc;margin:10px 6px 0;padding-left:18px;font-size:13px;line-height:1.5;color:var(--ink-2)}
.facts li::marker{color:#edbb00}
.sec-h .sub{font:400 11px var(--f-body);letter-spacing:0;text-transform:none;color:var(--ink-3)}
.filters.lead{flex-wrap:nowrap}
/* ---------- La Roja (Spain): red + gold ---------- */
#sheet.spain{filter:drop-shadow(0 0 10px rgba(198,11,30,.55)) drop-shadow(0 0 18px rgba(255,196,0,.3))}
#sheet.spain .frame{background:linear-gradient(160deg,#ffc400,#c60b1e 30%,#7a0716 55%,#2f2752 75%,#ffc400)}
#sheet.spain .inner{background:linear-gradient(180deg,#1a0a1e,#0a0820 40%)}
#sheet.spain .sh-head{background:linear-gradient(180deg,rgba(198,11,30,.32) 0 25%,rgba(255,196,0,.18) 25% 75%,rgba(198,11,30,.32) 75%);border-bottom:2px solid #ffc400}
#sheet.spain .sh-title{color:#fff3d0;text-shadow:0 0 2px #fff,0 0 8px #ffc400,0 0 20px #c60b1e}
#sheet.spain .sh-icon{--c:#ffc400}
#sheet.spain .btabs button[aria-selected="true"]{border-bottom-color:#ffc400}
#sheet.spain .sb{background:linear-gradient(180deg,rgba(198,11,30,.26),rgba(255,196,0,.1))}
#sheet.spain .sb::before{background:linear-gradient(90deg,#c60b1e 0 25%,#ffc400 25% 75%,#c60b1e 75%)}
#sheet.spain .tr.me{background:linear-gradient(90deg,rgba(198,11,30,.4),rgba(255,196,0,.18))}
#sheet.spain .leaders .av{background:linear-gradient(135deg,#c60b1e,#7a0716);box-shadow:inset 0 0 0 1.5px rgba(255,196,0,.8)}
#sheet.spain .facts li::marker{color:#ffc400}
.crest.esp{background:linear-gradient(180deg,#c60b1e 0 25%,#ffc400 25% 75%,#c60b1e 75%);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35)}
.filters.comps{padding-top:0;margin-top:-2px}
.chip.sm{font-size:11px;padding:5px 9px 4px;letter-spacing:.1em}
.seg{display:flex;margin:0 2px 12px;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.seg button{flex:1;border:0;background:none;padding:8px 6px;font:600 12px var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-checked="true"]{color:#fff;background:color-mix(in srgb,var(--c) 20%,transparent);text-shadow:0 0 8px var(--c)}
.tr.po::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:0 2px 2px 0;background:#f0a020}
.zones{margin:8px 6px 0;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;font-size:11.5px;color:var(--ink-3)}
.zones .z{display:inline-block;width:3px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.z.ucl{background:#2f7dff}.z.po{background:#f0a020}.z.rel{background:#e0354b}
.tile.gold{border-color:#ffc400;box-shadow:inset 0 0 16px rgba(255,196,0,.18)}
.tile .star{display:block;filter:drop-shadow(0 0 6px rgba(255,196,0,.8))}
.leaders .pn small{display:block;font-weight:400;font-size:12px;color:var(--ink-3)}
.leaders{list-style:none;margin:6px 0 0;padding:0}
.leaders li{display:grid;grid-template-columns:20px 34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 6px;border-bottom:1px solid var(--line)}
.leaders .rk{font:400 18px/1 var(--f-led);color:var(--ink-3);text-align:center}
.leaders .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 12px var(--f-display);font-style:normal;color:#fff;background:linear-gradient(135deg,#004d98,#a50044);box-shadow:inset 0 0 0 1.5px rgba(237,187,0,.7)}
.leaders .pn{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.leaders .rate{font:700 13px var(--f-display);color:#fff;padding:4px 7px;border-radius:4px;min-width:42px;text-align:center}
.leaders .val{font:400 22px/1 var(--f-led);color:#fff}
.tbl{display:grid;font-size:12.5px;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.tr{display:grid;grid-template-columns:26px minmax(0,1fr) 24px 24px 24px 24px 32px 32px;gap:4px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--line);color:var(--ink-2);text-align:center;position:relative}
.tr:last-child{border-bottom:0}
.tr.th{font:600 10.5px var(--f-display);letter-spacing:.12em;color:var(--ink-3);text-transform:uppercase;background:rgba(255,255,255,.03)}
.tr .tn{display:flex;align-items:center;gap:7px;text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--ink)}
.tr b{color:#fff;font-weight:700}
.tr.ucl::before,.tr.rel::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:0 2px 2px 0;background:#2f7dff}
.tr.rel::before{background:#e0354b}
.tr.me{background:linear-gradient(90deg,rgba(0,77,152,.35),rgba(165,0,68,.25));color:#fff}
.tr.me .tn{font-weight:700}
.src{margin:14px 6px 0;font-size:11.5px;color:var(--ink-3);line-height:1.45}
/* ---------- v0.8 panels ---------- */
.frm{display:grid;gap:8px;margin-top:6px}
.frm input,.frm select{font:500 14.5px var(--f-body);padding:9px 11px;border-radius:2px;border:1px solid var(--wire);background:#07061a;color:var(--ink);min-width:0;width:100%}
.frm input:focus,.frm select:focus{outline:none;border-color:var(--c,var(--cyan))}
.frm .btn{justify-self:start}
.frow{display:flex;gap:8px;align-items:center}.frow>*{flex:1}.frow .btn{flex:none}
.frm.inline{display:flex;gap:6px;margin-top:8px}.frm.inline input{padding:6px 9px;font-size:13.5px}
.btn.sm{padding:5px 9px;font-size:11px;letter-spacing:.12em}
.icon-btn.sm{width:28px;height:28px}.icon-btn.sm svg{width:14px;height:14px}
.more{margin-top:8px}.more summary{cursor:pointer;font:600 11.5px var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}.more[open] summary{margin-bottom:6px}
.hint-row.tight{margin:2px 6px}
.hab{border:1px solid var(--line);border-left:2px solid var(--c);border-radius:2px;padding:12px;margin-bottom:12px;background:color-mix(in srgb,var(--c) 4%,transparent)}
.hab-h{display:flex;align-items:center;gap:8px}.hab-h .dot{width:9px;height:9px;rotate:45deg;background:var(--c);box-shadow:0 0 8px var(--c)}
.hab-h b{font:600 16px var(--f-body)}.hab-h .per{font:400 16px/1 var(--f-led);color:var(--ink-3)}
.hab-do{display:flex;gap:8px;align-items:center;justify-content:center;width:100%;margin:10px 0 8px;padding:11px;border-radius:2px;border:1.5px solid var(--c);background:transparent;color:var(--c);font:700 13px var(--f-display);letter-spacing:.16em;text-transform:uppercase;cursor:pointer}
.hab-do.on{background:var(--c);color:#06121a;box-shadow:0 0 16px color-mix(in srgb,var(--c) 55%,transparent)}
.hab-week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.hd{height:30px;border-radius:2px;border:1px solid var(--line);background:transparent;color:var(--ink-3);font:600 11px var(--f-display);cursor:pointer}
.hd.on{background:color-mix(in srgb,var(--c) 70%,transparent);border-color:var(--c);color:#06121a}.hd.now{outline:1px solid var(--ink-3);outline-offset:1px}.hd:disabled{opacity:.35;cursor:default}
.hab-stats{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:9px;font-size:12.5px;color:var(--ink-2)}.hab-stats b{font:400 19px/1 var(--f-led);color:#fff;margin-right:2px}
.hab-grow{margin-top:6px;font-size:12.5px;color:var(--c)}
.heat{display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:repeat(7,7px);gap:2px;margin-top:9px}
.heat i{background:rgba(255,255,255,.06);border-radius:1px}.heat i.on{background:var(--c);box-shadow:0 0 4px var(--c)}.heat i.fut{background:transparent}
.cwl{list-style:none;margin:0;padding:0}
.cw{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:start;padding:10px 6px;border-bottom:1px solid var(--line)}
.cw-d{display:grid;justify-items:center;border:1px solid var(--line);border-radius:2px;padding:4px 0}.cw-d b{font:400 22px/1 var(--f-led);color:#fff}.cw-d span{font:600 10px var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.cw-t{font:600 14.5px/1.3 var(--f-body)}.cw .acts{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;align-items:center}.cw .acts .icon-btn{margin-left:auto}
.cw .cnt{font:400 16px/1 var(--f-led);color:var(--ink-2)}
.cw.warm .cnt{color:var(--amber)}.cw.hot .cnt,.cw.late .cnt{color:var(--alert);text-shadow:0 0 6px rgba(255,106,134,.6)}.cw.hot .cw-d,.cw.late .cw-d{border-color:var(--alert)}
.cw-s{font:600 10px var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);padding:3px 6px;border:1px solid var(--line);border-radius:2px;white-space:nowrap}.cw-s.s-doing{color:var(--cyan);border-color:var(--cyan)}
.cw.done .cw-t{color:var(--ink-3);text-decoration:line-through}.cw.done .cw-d{color:var(--lime);border:0}
.proj{border:1px solid var(--line);border-left:2px solid var(--c);border-radius:2px;padding:12px;margin-bottom:12px}.proj.s-paused{opacity:.7}.proj.s-done{border-left-color:var(--lime)}
.proj-h{display:flex;gap:8px;align-items:center;justify-content:space-between}.proj-h b{font:600 16px var(--f-body)}

<script>

/* =====================================================================
   SCENE: a floating neon sky-island
   ===================================================================== */
const N = 11;
const clockHands = [];
const LABELS = [];
const SB = {};
let gardenSlot = null;
let defsEl;
const gradCache = {};
function cg(col) { // horizontal shading for round surfaces and rock layers

function hgrad(col) { // trail gradient: solid at the ship, fading behind

function arcD(x, y, z, r, t0 = 0, t1 = 1) {

const sq = (t, k) => { const c = Math.cos(t), s = Math.sin(t), n = 5; const r = k / Math.pow(Math.pow(Math.abs(c), n) + Math.pow(Math.abs(s), n), 1 / n); return [r * c, r * s]; };

  if (act === "hcheck" && id) return habitToggle(id, todayK());
  if (act === "hday" && id) return habitToggle(id, a.dataset.d);
  if (act === "hdel" && it) { store.remove(id); return toast(`Removed ${it.name}.`, "Undo", () => store.set(id, it)); }
  if (act === "cwstat" && it) { store.update(id, { status: it.status === "doing" ? "done" : "doing", doneAt: it.status === "doing" ? Date.now() : null }); if (it.status === "doing") toast(`Submitted: ${it.title}`); return; }
  if (act === "cwundo" && it) return store.update(id, { status: "doing" });
  if (act === "cwtodo" && it) { newItem({ kind: "todo", title: it.title + (it.module ? ` (${it.module})` : ""), category: "academic", due: it.due || null, time: null, done: false, doneAt: null, raw: it.title, manual: true, edited: true }); toast("Added to your to-dos"); return pulse("todo"); }
  if (act === "cwfocus" && it) { st.fLabel = it.title; st.fArea = it.module || "academic"; return openPanel("focus"); }
  if (act === "cwdel" && it) { store.remove(id); return toast("Deadline deleted.", "Undo", () => store.set(id, it)); }
  if (act === "pstat" && it) return store.update(id, { status: { active: "paused", paused: "done", done: "active" }[it.status || "active"] });
  if (act === "msTog" && it) { const ms = (it.milestones || []).map((m, i) => i === +a.dataset.i ? { ...m, done: !m.done } : m); return store.update(id, { milestones: ms }); }
  if (act === "pdel" && it) { store.remove(id); return toast(`Deleted ${it.title}.`, "Undo", () => store.set(id, it)); }
  if (act === "padv" && it) { const i = POST_FLOW.indexOf(it.status || "idea"); return store.update(id, { status: POST_FLOW[Math.min(3, i + 1)], postedAt: i + 1 === 3 ? Date.now() : null }); }
  if (act === "caption" && it) return draftCaption(id);
  if (act === "postdel" && it) { store.remove(id); return toast("Post removed.", "Undo", () => store.set(id, it)); }
  if (act === "fdur") { st.fDur = +a.dataset.k; const l = sheet.querySelector('[data-form=focus] input[name=label]'); if (l) st.fLabel = l.value; return renderPanel(); }
  if (act === "farea") { st.fArea = a.dataset.k; const l = sheet.querySelector('[data-form=focus] input[name=label]'); if (l) st.fLabel = l.value; return renderPanel(); }
  if (act === "fstop") return endFocus(true);
  if (act === "fcancel") return endFocus(false);
  if (act === "fsum") return focusSummary();
  if (act === "fdel" && it) { store.remove(id); return toast("Session deleted.", "Undo", () => store.set(id, it)); }
  if (act === "review") return writeReview();
  if (!it) return;
  if (act === "toggle") { const done = !it.done; store.update(id, { done, doneAt: done ? Date.now() : null }); if (done) { pulse("todo"); toast("Done: " + it.title, "Undo", () => store.update(id, { done: false, doneAt: null })); } }
  else if (act === "edit") { st.edit = st.edit === id ? null : id; renderPanel(); const t = $("#ed-title"); if (t) t.focus(); }
  else if (act === "setcat") { row.querySelectorAll("[data-act=setcat]").forEach(c => c.setAttribute("aria-checked", String(c === a))); row.dataset.cat = a.dataset.cat; }
  else if (act === "save") {
    const title = $("#ed-title").value.trim() || it.title;
    const patch = { title, due: $("#ed-due").value || null, time: $("#ed-time").value || null, category: row.dataset.cat || it.category, edited: true };
    st.edit = null; a.blur(); store.update(id, patch);
  }
  else if (act === "cancel") { st.edit = null; a.blur(); renderPanel(); }
  else if (act === "del") { st.edit = null; a.blur(); const copy = { ...it }; store.remove(id); toast("Deleted", "Undo", () => store.set(id, copy)); }
  else if (act === "toidea") { st.edit = null; a.blur(); store.update(id, { kind: "idea", due: null, time: null, edited: true }); toast("Moved to Ideas"); pulse("ideas"); }
  else if (act === "totodo") { store.update(id, { kind: "todo", category: it.category || "misc", edited: true }); toast("Now a to-do in Task HQ"); pulse("todo"); }
  else if (act === "steps") ideaSteps(id);
});
sheet.addEventListener("submit", e => {
  const f = e.target.closest("form.frm"); if (!f) return; e.preventDefault();
  const v = Object.fromEntries(new FormData(f)), k = f.dataset.form, row = f.closest("[data-id]"), id = row && row.dataset.id, it = id && st.items.get(id);
  const clean = x => String(x || "").trim();
  if (k === "habit" && clean(v.name)) { const per = v.per === "day" ? "day" : "week"; if (habits().length >= 4) return toast("The garden has four beds. Remove a habit to plant a new one."); newItem({ kind: "habit", name: clean(v.name).slice(0, 40), per, target: per === "day" ? 7 : +String(v.per).slice(1) || 3, color: HABIT_COLS[habits().length % HABIT_COLS.length], log: [] }); pulse("habits"); }
  else if (k === "cw" && clean(v.title) && v.due) { newItem({ kind: "cw", title: clean(v.title).slice(0, 80), module: clean(v.module).slice(0, 40), due: v.due, weight: v.weight ? Math.max(0, Math.min(100, +v.weight)) : null, status: "todo" }); pulse("cw"); }
  else if (k === "project" && clean(v.title)) newItem({ kind: "project", title: clean(v.title).slice(0, 60), next: clean(v.next).slice(0, 120), status: "active", milestones: [], links: [] });
  else if (k === "ms" && it && clean(v.t)) store.update(id, { milestones: [...(it.milestones || []), { t: clean(v.t).slice(0, 80), done: false }] });
  else if (k === "pedit" && it) { const patch = { title: clean(v.title).slice(0, 60) || it.title, next: clean(v.next).slice(0, 120) }; if (/^https?:\/\//i.test(clean(v.url))) patch.links = [...(it.links || []), { label: clean(v.label).slice(0, 30), url: clean(v.url).slice(0, 300) }]; store.update(id, patch); }
  else if (k === "post" && clean(v.title)) newItem({ kind: "post", title: clean(v.title).slice(0, 90), platform: ["instagram", "github", "both"].includes(v.platform) ? v.platform : "instagram", projectId: v.projectId || null, status: "idea" });
  else if (k === "focus") { blurInput(); st.fLabel = ""; return startFocus(clean(v.label) || "Deep work", st.fArea || "academic", st.fDur || 25); }
  else if (k === "flog" && clean(v.label) && +v.mins > 0) newItem({ kind: "focus", label: clean(v.label).slice(0, 80), area: "academic", mins: Math.min(300, Math.round(+v.mins)), start: Date.now() - (+v.mins) * 6e4 });
  else return;
  f.reset(); blurInput(); renderPanel();
});
sheet.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.closest(".edit input")) { e.preventDefault(); const s = sheet.querySelector("[data-act=save]"); s && s.click(); } });
document.addEventListener("keydown", e => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || "");
  if (e.key === "Escape") { if (typing) document.activeElement.blur(); else if (st.panel) closePanel(); return; }
  if (typing) return;
  if ((e.key === "n" || e.key === "/") && !e.metaKey && !e.ctrlKey) { e.preventDefault(); qInput.focus(); }
  else if (e.key === "+" || e.key === "=") zoomAt(vw() / 2, vh() / 2, .8);
  else if (e.key === "-") zoomAt(vw() / 2, vh() / 2, 1.25);
  else if (e.key === "0") flyTo(fitCam(FIT));
  else if (e.key.startsWith("Arrow") && !e.target.closest("#sheet")) { e.preventDefault(); const m = 90;
    panBy(e.key === "ArrowLeft" ? -m : e.key === "ArrowRight" ? m : 0, e.key === "ArrowUp" ? -m : e.key === "ArrowDown" ? m : 0); }
});
new ResizeObserver(() => document.documentElement.style.setProperty("--qh", $("#quick").offsetHeight + "px")).observe($("#quick"));

/* boot */
drawScene(); buildLabels();
cam = fitCam(FIT); applyCam(true);
tickClock(); updateHint(); render();
if (focusRun) { if (focusRun.start + focusRun.mins * 6e4 < Date.now()) endFocus(true); else { svg.classList.add("focusing"); runFocusTicker(); } }
setInterval(tickClock, 30000);
let startView = "island"; try { startView = localStorage.getItem("island.view") || "island"; } catch (e) {}
if (startView === "list") openPanel("todo", true);
initData();
})();
