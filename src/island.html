<title>Xavier's Island</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Tilt+Neon&family=VT323&display=swap">
<style>
/* Layout: a floating neon sky-island you pan around. The HUD is in-world signage: a neon-tube title with an LED ticker,
   a neon switch, a holo console for quick-add, and neon-framed building panels. One committed night look. */
:root{
  color-scheme:dark;
  --ink:#f1ecff; --ink-2:#b4aad8; --ink-3:#7d74a6;
  --panel:#0e0b1f; --panel-2:#1a1534; --line:#2f2752; --wire:#3b3166;
  --pink:#ff4fa8; --cyan:#35e6ff; --violet:#b46cff; --amber:#ffc83d; --lime:#7dff6a;
  --accent:#ff4fa8; --accent-ink:#1d0414; --alert:#ff6a86; --focus:#35e6ff;
  --c-academic:#5aa8ff; --c-fitness:#ff4f9a; --c-daily:#ffc83d; --c-misc:#3fffc8; --c-idea:#ffe14d;
  --b-todo:#35e6ff; --b-cal:#ff4fa8; --b-mail:#b46cff; --b-ideas:#ffe14d;
  --g-todo:#35e6ff; --g-cal:#ff4fa8; --g-mail:#b46cff; --g-ideas:#ffe14d;
  --bg:#0a0820;
  --f-neon:"Tilt Neon","Chakra Petch",system-ui,sans-serif;
  --f-display:"Chakra Petch","Eurostile","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --f-led:"VT323","IBM Plex Mono",ui-monospace,monospace;
  --qh:122px;
  --cut:14px;
}
[hidden]{display:none!important} /* the host page may not ship this rule; without it the empty panel covered the map */
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.cham{clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut))}

/* ---------- scene ---------- */
#world{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
#stage{position:absolute;inset:0;touch-action:none;cursor:grab;overflow:hidden;transition:filter .35s ease;-webkit-user-select:none;user-select:none}
#stage.dragging{cursor:grabbing}
#cam{position:absolute;inset:0;transform-origin:0 0;will-change:transform}
.lyr{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
#sceneBack,#sceneFront{pointer-events:none;will-change:transform} /* own layers: their ambient motion never repaints the island */
.hit{fill:transparent}
/* the island layer is kept still so it can be cached; only a few cheap step-blinks remain on it */
#scene .pulse,#scene .flow,#scene .scan,#scene .bob,#scene .twinkle,#scene .drift,#scene .fall,#scene .spinP{animation:none}
#stage.moving .lyr *{animation-play-state:paused!important}
.o{stroke:#0b0818;stroke-width:1.2;stroke-linejoin:round;stroke-linecap:round}
.on{stroke:#0b0818;stroke-width:1.1;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.lit{opacity:var(--lights,1);transition:opacity 1.5s}
.cl{fill:var(--cloud,#2b2552)}
.clh{fill:var(--cloudHi,#3d3570)}
.bldg{cursor:pointer}
.bldg .hl{opacity:0;transition:opacity .2s}
.bldg.hot .hl{opacity:1}
.plot{cursor:pointer}
.ntxt{font-family:"Tilt Neon","Chakra Petch",sans-serif}
.bob{animation:bob 6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.blink{animation:blink 2.2s steps(1) infinite}
@keyframes blink{50%{opacity:.1}}
.flick{animation:flick 7s linear infinite}
@keyframes flick{0%,60%,63%,66%,100%{opacity:1}61.5%,64.5%{opacity:.25}}
.scan{animation:scan 3s linear infinite}
@keyframes scan{from{transform:translateY(0)}to{transform:translateY(14px)}}
.pulse{animation:pls 2.6s ease-in-out infinite}
@keyframes pls{50%{opacity:.45}}
.twinkle{animation:tw 3.5s ease-in-out infinite}
@keyframes tw{50%{opacity:.3}}
.fall{animation:fall .9s linear infinite}
@keyframes fall{to{stroke-dashoffset:-40}}
.flow{animation:flow 1.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-.9}}
.drift{animation:drift 90s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(80px)}}
.spinP{transform-box:fill-box;transform-origin:center;animation:sp .25s linear infinite}
@keyframes sp{50%{transform:scaleX(.15)}}

/* hover tags + count pips: little neon signs */
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;border:1.5px solid var(--glow);border-radius:3px;padding:6px 14px 5px;background:rgba(8,6,20,.88);color:#fff;
  font:400 19px/1 var(--f-neon);letter-spacing:.06em;white-space:nowrap;cursor:pointer;text-align:center;
  text-shadow:0 0 2px #fff,0 0 8px var(--glow),0 0 16px var(--glow);
  box-shadow:0 0 0 1px rgba(0,0,0,.5),0 0 14px color-mix(in srgb,var(--glow) 55%,transparent),inset 0 0 10px color-mix(in srgb,var(--glow) 25%,transparent);
  opacity:0;scale:.85;pointer-events:none;transition:opacity .16s,scale .2s cubic-bezier(.3,1.6,.5,1);will-change:transform}
.lbl small{display:block;margin-top:3px;font:400 16px/1 var(--f-led);letter-spacing:.04em;text-shadow:0 0 6px var(--glow);color:var(--glow)}
.lbl.show,.lbl.sel,.lbl:focus-visible{opacity:1;scale:1;pointer-events:auto}
.lbl::after{content:"";position:absolute;left:50%;bottom:-12px;width:1.5px;height:10px;margin-left:-.75px;background:var(--glow);box-shadow:0 0 6px var(--glow)}
.pip{position:absolute;left:0;top:0;min-width:24px;height:24px;padding:0 6px;display:grid;place-items:center;font:400 20px/1 var(--f-led);color:#fff;
  background:#e8235f;border:1.5px solid #ffd1e0;border-radius:3px;box-shadow:0 0 14px rgba(255,40,100,.9);pointer-events:none;transition:opacity .2s}
.pip[hidden]{display:none}

/* map controls */
.mapctl{position:fixed;z-index:22;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(var(--qh) + 12px);display:grid;gap:6px}
.mapctl button{width:40px;height:40px;border-radius:2px;border:1px solid var(--wire);background:rgba(10,8,28,.82);display:grid;place-items:center;cursor:pointer;color:var(--cyan);filter:drop-shadow(0 0 4px rgba(53,230,255,.5))}
.mapctl button:hover{border-color:var(--cyan);box-shadow:0 0 12px rgba(53,230,255,.45)}
@media (max-width:720px){.mapctl{display:none}}

/* ---------- HUD top: neon title + LED ticker + neon switch ---------- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:19;background:var(--bg)}
.hud-top{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
  padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.sign{pointer-events:auto;display:grid;gap:4px;min-width:0}
.sign .t{font:400 32px/1 var(--f-neon);color:#fff0fb;letter-spacing:.03em;white-space:nowrap;
  text-shadow:0 0 2px #fff,0 0 7px #ff4fa8,0 0 16px #ff4fa8,0 0 32px #ff2f8f,0 2px 0 rgba(0,0,0,.6)}
.sign .t em{font-style:normal;color:#eafdff;text-shadow:0 0 2px #fff,0 0 7px #35e6ff,0 0 16px #35e6ff,0 0 32px #1fb8ff,0 2px 0 rgba(0,0,0,.6)}
.sign .t .flk{animation:tube 7s linear infinite}
@keyframes tube{0%,70%,72%,75%,100%{opacity:1}71%,73.5%{opacity:.2}}
.ticker{display:inline-flex;gap:10px;align-items:center;font:400 20px/1 var(--f-led);color:var(--amber);letter-spacing:.08em;text-shadow:0 0 6px rgba(255,200,61,.65);padding:3px 8px 2px;background:rgba(10,8,28,.7);border:1px solid #3a2f12;border-radius:2px;width:max-content}
.ticker i{width:6px;height:6px;border-radius:50%;background:var(--lime);box-shadow:0 0 6px var(--lime);animation:blink 2s steps(1) infinite}
.plate{pointer-events:auto;padding:1px;background:linear-gradient(90deg,rgba(53,230,255,.7),rgba(255,79,168,.7));--cut:10px}
.plate>.in{background:rgba(10,8,28,.9);--cut:10px}
.switch{display:flex;align-items:center;padding:3px 6px}
.switch i{width:1.5px;height:20px;background:var(--wire)}
.switch button{border:0;background:none;padding:6px 12px 5px;font:400 21px/1 var(--f-neon);letter-spacing:.06em;color:#4f4677;cursor:pointer;transition:color .2s,text-shadow .2s}
.switch button:hover{color:#8c80bd}
.switch button[aria-pressed="true"]{color:#eafdff;text-shadow:0 0 2px #fff,0 0 8px #35e6ff,0 0 18px #35e6ff}
@media (max-width:440px){.sign .t{font-size:24px}.ticker{font-size:17px}.switch button{font-size:18px;padding:5px 8px}}

/* ---------- quick-add: a holo console ---------- */
#quick{position:fixed;left:0;right:0;bottom:0;z-index:30;pointer-events:none;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.qglow{pointer-events:auto;max-width:740px;margin:0 auto;filter:drop-shadow(0 0 8px rgba(255,79,168,.4)) drop-shadow(0 0 22px rgba(53,230,255,.18))}
.qframe{padding:1.5px;background:linear-gradient(100deg,#35e6ff,#b46cff 50%,#ff4fa8)}
.qcard{position:relative;background:linear-gradient(180deg,rgba(22,15,48,.97),rgba(9,7,24,.97));padding:10px 10px 9px;display:grid;grid-template-columns:minmax(0,1fr);gap:9px}
.qcard::after,.inner::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px)}
.qrow{display:flex;gap:8px}
.field{flex:1;min-width:0;padding:1px;background:var(--wire);--cut:9px;transition:background .2s}
.field:focus-within{background:linear-gradient(90deg,var(--cyan),var(--violet))}
.field>div{display:flex;align-items:center;background:#07061a;--cut:9px;height:100%}
.prompt{padding:0 4px 0 12px;font:400 26px/1 var(--f-led);color:var(--cyan);text-shadow:0 0 8px var(--cyan)}
#qInput{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:500 16px var(--f-body);padding:12px 12px 12px 4px;outline:none}
#qInput::placeholder{color:#6a6196}
.btn-go{flex:none;--cut:9px;border:0;padding:0 22px;cursor:pointer;font:700 15px var(--f-display);letter-spacing:.22em;text-transform:uppercase;color:var(--accent-ink);
  background:linear-gradient(180deg,#ffa0d8,#ff4fa8 55%,#e02f8a);transition:filter .15s}
.btn-go:hover{filter:brightness(1.12) saturate(1.1)}
.btn-go:active{filter:brightness(.92)}
.qmeta{display:flex;align-items:center;gap:10px;min-width:0}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;--cut:6px;font:600 12px var(--f-display);letter-spacing:.12em;text-transform:uppercase;padding:6px 10px 5px;border:0;
  background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px var(--wire);color:#8f86b8;display:inline-flex;align-items:center;gap:7px;cursor:pointer;white-space:nowrap;border-radius:2px}
.chip:hover{color:var(--ink)}
.chip .dot{width:7px;height:7px;rotate:45deg;background:var(--c,#8f86b8);box-shadow:0 0 6px var(--c,transparent)}
.chip[aria-checked="true"]{color:#fff;background:color-mix(in srgb,var(--c,var(--cyan)) 18%,transparent);box-shadow:inset 0 0 0 1px var(--c,var(--cyan)),0 0 10px color-mix(in srgb,var(--c,var(--cyan)) 40%,transparent);text-shadow:0 0 8px var(--c,var(--cyan))}
.chip .n{font:400 16px/1 var(--f-led);letter-spacing:0;color:var(--ink-3)}
#qHint{font:400 18px/1 var(--f-led);color:var(--amber);text-shadow:0 0 6px rgba(255,200,61,.5);white-space:nowrap;flex:none;letter-spacing:.03em}
#qHint b{color:#fff;font-weight:400}
@media (max-width:600px){.qmeta{flex-direction:column;align-items:stretch;gap:6px}#qHint{white-space:normal;min-height:1.1em}}

/* ---------- building panel: a neon-framed screen ---------- */
#sheet{position:fixed;z-index:25;top:calc(env(safe-area-inset-top,0px) + 92px);right:max(16px,env(safe-area-inset-right,0px));bottom:calc(var(--qh) + 8px);
  width:min(440px,calc(100vw - 32px));display:flex;filter:drop-shadow(0 0 10px color-mix(in srgb,var(--c) 45%,transparent));animation:sheetIn .24s cubic-bezier(.2,1.2,.4,1)}
#sheet.wide{right:auto;left:50%;transform:translateX(-50%);width:min(760px,calc(100vw - 32px))}
#sheet .frame{flex:1;display:flex;min-height:0;min-width:0;width:100%;padding:1.5px;--cut:18px;background:linear-gradient(160deg,var(--c),color-mix(in srgb,var(--c) 30%,#2f2752) 35%,#2f2752 65%,var(--c))}
#sheet .inner{position:relative;flex:1;display:flex;flex-direction:column;min-height:0;min-width:0;--cut:18px;background:linear-gradient(180deg,#151030,#0a0820)}
@keyframes sheetIn{from{translate:0 14px;opacity:0}to{translate:0 0;opacity:1}}
@media (min-width:721px){#app.sheet-open:not(.wide-open) #stage{right:calc(min(440px,100vw - 32px) + 20px)}}
#app.wide-open #stage{filter:saturate(.7) brightness(.5)}
@media (max-width:720px){
  #sheet,#sheet.wide{top:calc(env(safe-area-inset-top,0px) + 34vh);left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));width:auto;transform:none}
  #sheet.wide{top:calc(env(safe-area-inset-top,0px) + 92px)}
  .lbl.sel{opacity:0;pointer-events:none}
}
.sh-head{display:flex;align-items:center;gap:12px;padding:16px 14px 12px 20px;border-bottom:1px solid var(--line);position:relative;z-index:1}
.sh-icon{flex:none;width:42px;height:42px;display:grid;place-items:center;color:var(--c);border:1.5px solid var(--c);border-radius:2px;box-shadow:0 0 10px color-mix(in srgb,var(--c) 45%,transparent),inset 0 0 10px color-mix(in srgb,var(--c) 30%,transparent);filter:drop-shadow(0 0 4px var(--c))}
.sh-title{font:400 32px/1 var(--f-neon);color:#fff;letter-spacing:.03em;text-shadow:0 0 2px #fff,0 0 8px var(--c),0 0 20px var(--c)}
.sh-sub{font:400 18px/1 var(--f-led);color:var(--ink-2);margin-top:5px;letter-spacing:.04em}
.icon-btn{margin-left:auto;flex:none;width:36px;height:36px;border-radius:2px;border:1px solid var(--wire);background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.icon-btn:hover{color:#fff;border-color:var(--c);box-shadow:0 0 10px color-mix(in srgb,var(--c) 40%,transparent)}
.sh-body{position:relative;z-index:1;flex:1;min-height:0;overflow:auto;padding:12px 16px 22px;overscroll-behavior:contain;scrollbar-color:var(--wire) transparent}

/* lists */
ul{list-style:none;margin:0;padding:0}
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 6px}
.grp{margin-top:12px}
.grp-h{display:flex;align-items:baseline;gap:8px;font:700 12px var(--f-display);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);padding:0 6px 4px}
.grp-h.over{color:var(--alert);text-shadow:0 0 8px rgba(255,106,134,.6)}
.grp-h .n{font:400 17px/1 var(--f-led);letter-spacing:0}
.item{display:grid;grid-template-columns:28px minmax(0,1fr);align-items:start;gap:10px;padding:9px 8px;border-radius:2px;border-left:2px solid transparent}
.item:hover{background:rgba(255,255,255,.04);border-left-color:var(--c)}
.ck{margin-top:1px;width:22px;height:22px;border-radius:2px;border:1.5px solid var(--c);background:transparent;display:grid;place-items:center;cursor:pointer;padding:0;color:var(--c);box-shadow:0 0 8px color-mix(in srgb,var(--c) 40%,transparent)}
.ck svg{opacity:0;transition:opacity .15s}
.ck:hover svg{opacity:.5}
.item.done .ck{background:var(--c);color:#0a0820}
.item.done .ck svg{opacity:1}
.ttl{display:block;width:100%;background:none;border:0;text-align:left;font:500 15px/1.35 var(--f-body);color:var(--ink);cursor:pointer;padding:0;overflow-wrap:anywhere}
.item.done .ttl{text-decoration:line-through;color:var(--ink-3)}
.meta{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:5px;font-size:12px;color:var(--ink-2)}
.tag{display:inline-flex;align-items:center;gap:5px;padding:1px 7px;border-radius:2px;border:1px solid var(--line);font-weight:600;white-space:nowrap}
.tag.t{font:400 16px/1.1 var(--f-led);color:var(--amber);border-color:#3a2f12}
.tag.over{color:var(--alert);border-color:#5a1f30}
.tag.ex{border-style:dashed;border-color:var(--ink-3)}
.cat-dot{width:7px;height:7px;rotate:45deg;background:var(--c);box-shadow:0 0 6px var(--c)}
.ai{color:var(--cyan);display:inline-flex;filter:drop-shadow(0 0 4px var(--cyan))}
.edit{background:rgba(255,255,255,.035);border-radius:2px;padding:12px;margin:2px 0 8px;display:grid;gap:10px;border:1px solid var(--line);border-left:2px solid var(--cyan)}
.edit label{font:700 11px var(--f-display);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);display:grid;gap:5px}
.edit input{font:500 15px var(--f-body);padding:9px 11px;border-radius:2px;border:1px solid var(--wire);background:#07061a;color:var(--ink);min-width:0;width:100%}
.edit input:focus{outline:none;border-color:var(--cyan)}
.edit .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.edit .acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--wire);background:transparent;border-radius:2px;padding:7px 12px;font:600 12px var(--f-display);letter-spacing:.14em;text-transform:uppercase;cursor:pointer;color:var(--ink-2)}
.btn:hover{border-color:var(--cyan);color:#fff}
.btn.primary{background:var(--pink);border-color:var(--pink);color:var(--accent-ink);box-shadow:0 0 12px rgba(255,79,168,.45)}
.btn.danger{color:var(--alert)}
.btn.ghost{border-color:transparent}
.btn:disabled{opacity:.55;cursor:default}
.empty{padding:26px 10px;text-align:center;color:var(--ink-2);line-height:1.5}
.empty b{display:block;font:400 24px var(--f-neon);color:#fff;margin-bottom:6px;text-shadow:0 0 8px var(--c,var(--cyan))}
.done-toggle{margin-top:14px;width:100%;text-align:left;border:0;background:transparent;padding:8px 6px;font:700 12px var(--f-display);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);cursor:pointer}
.banner{font-size:13px;line-height:1.45;padding:10px 12px;border-radius:2px;background:rgba(255,200,61,.06);border:1px solid #3a2f12;border-left:2px solid var(--amber);margin-bottom:8px}
.sec-h{font:700 12px var(--f-display);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);margin:18px 6px 8px;display:flex;gap:8px;align-items:center}
.sec-h:first-child{margin-top:4px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.day{border-radius:2px;background:rgba(255,255,255,.035);padding:8px 2px;text-align:center;display:grid;gap:3px;justify-items:center;border:1px solid var(--line)}
.day.today{border-color:var(--b-cal);box-shadow:0 0 10px rgba(255,79,168,.35)}
.day small{font:700 11px var(--f-display);letter-spacing:.12em;color:var(--ink-3);text-transform:uppercase}
.day strong{font:400 24px/1 var(--f-led);color:#fff}
.dots{display:flex;gap:2px;min-height:6px}
.dots i{width:6px;height:6px;rotate:45deg;background:var(--c);box-shadow:0 0 5px var(--c)}
.trow{display:grid;grid-template-columns:70px minmax(0,1fr);gap:10px;padding:9px 6px;align-items:baseline;border-bottom:1px dashed var(--line)}
.trow time{font:400 18px/1 var(--f-led);color:var(--amber)}
.trow .t{overflow-wrap:anywhere}
.soon{border:1px dashed var(--wire);border-radius:2px;padding:14px;margin-top:18px}
.soon h4{margin:0 0 6px;font:400 22px var(--f-neon);color:#fff;text-shadow:0 0 8px var(--c,var(--cyan))}
.soon p{margin:0 0 10px;color:var(--ink-2);line-height:1.5;font-size:14px}
.ghost{opacity:.6}
.mail{border-radius:2px;background:rgba(255,255,255,.035);border:1px solid var(--line);padding:11px 12px;margin-bottom:8px}
.mail .from{font-weight:700;font-size:13.5px}
.mail .sub{font-size:14px;margin-top:2px}
.mail .why{font-size:12.5px;color:var(--ink-2);margin-top:4px}
.idea{border-radius:2px;background:rgba(255,225,77,.04);padding:12px 12px 10px;margin-bottom:10px;border:1px solid var(--line);border-left:2px solid var(--c-idea)}

  renderPanel();
  try { localStorage.setItem("island.view", wide ? "list" : "island"); } catch (e) {}
}
function closePanel() {
  st.panel = null; st.edit = null; sheet.hidden = true; sheet.innerHTML = "";
  $("#app").classList.remove("sheet-open", "wide-open");
  $("#vIsland").setAttribute("aria-pressed", "true"); $("#vList").setAttribute("aria-pressed", "false");
  setChip("auto"); selectB(null);
  try { localStorage.setItem("island.view", "island"); } catch (e) {}
}
function renderPanel() {
  if (!st.panel) return;
  const body = $("#shBody"); if (!body) return;
  const a = document.activeElement;
  if (a && body.contains(a) && a.tagName === "INPUT") return;
  $("#shSub").textContent = st.mode === "loading" ? BINFO[st.panel].s : sheetSub(st.panel);
  if (st.mode === "loading" && (st.panel === "todo" || st.panel === "ideas")) { body.innerHTML = `<div class="loading">Opening your island…</div>`; return; }
  const top = body.scrollTop;
  body.innerHTML = st.panel === "todo" ? todoBody() : st.panel === "cal" ? calBody() : st.panel === "mail" ? mailBody() : st.panel === "barca" ? barcaBody() : ideasBody();
  body.scrollTop = top;
}
function setBubble(b, n) { const p = pipEls[b]; if (p && b === "todo") { p.textContent = n > 99 ? "99+" : String(n); p.hidden = !(n > 0); } const l = labelEls[b]; if (l) l.querySelector("small").textContent = BINFO[b].s + (n > 0 ? (b === "todo" ? ` · ${n} due now` : ` · ${n} idea${n === 1 ? "" : "s"}`) : ""); }
function pulse(b) { showTag(b, true); clearTimeout(pulse.t); pulse.t = setTimeout(() => { if (hotB !== b) showTag(b, false); }, 1400); }
function render() {
  const loading = st.mode === "loading", ni = ideas().length, dn = dueNowCount();
  setBubble("todo", loading ? 0 : dn); setBubble("ideas", loading ? 0 : ni);
  const halo = $("#halo"); if (halo) halo.setAttribute("opacity", r1(Math.min(1, .2 + ni * .15)));
  updateStadium();
  if (labelEls.todo) labelEls.todo.setAttribute("aria-label", `Open To-dos. ${dn} due now.`);
  renderPanel();
}

/* quick add */
const qInput = $("#qInput"), qHint = $("#qHint");
const CHIPS = [["auto", "Auto", null], ["academic", "Academic", "var(--c-academic)"], ["fitness", "Fitness", "var(--c-fitness)"], ["daily", "Daily", "var(--c-daily)"], ["misc", "Misc", "var(--c-misc)"], ["idea", "Idea", "var(--c-idea)"]];
$("#qChips").innerHTML = CHIPS.map(([k, v, c]) => `<button type="button" class="chip" role="radio" data-chip="${k}" aria-checked="${k === "auto"}" ${c ? `style="--c:${c}"` : ""}>${c ? '<i class="dot"></i>' : SPARK}${v}</button>`).join("");
function setChip(k) { st.chip = k; document.querySelectorAll("#qChips .chip").forEach(b => b.setAttribute("aria-checked", String(b.dataset.chip === k))); updateHint(); }
function resolveQ(raw) {
  const p = parseQuick(raw); let kind = p.kind, category = p.category;
  if (st.chip === "idea") kind = "idea"; else if (st.chip !== "auto") { kind = "todo"; category = st.chip; }
  return { ...p, kind, category };
}
function updateHint() {
  const raw = qInput.value.trim();
  if (!raw) { qHint.innerHTML = st.chip === "auto" ? `Claude sorts it` : `Goes to <b>${st.chip === "idea" ? "Ideas" : CATS[st.chip]}</b>`; return; }
  const r = resolveQ(raw);
  qHint.innerHTML = `→ <b>${r.kind === "idea" ? "Ideas" : CATS[r.category]}</b>${r.kind !== "idea" && (r.due || r.time) ? " · " + esc(fmtDue(r.due, r.time)) : ""}`;
}
$("#qChips").addEventListener("click", e => { const b = e.target.closest("[data-chip]"); if (b) { setChip(b.dataset.chip); qInput.focus(); } });
qInput.addEventListener("input", updateHint);
$("#quick").addEventListener("submit", e => {
  e.preventDefault();
  const raw = qInput.value.trim(); if (!raw) { qInput.focus(); return; }
  if (st.mode === "loading") { toast("Still opening your island. Try again in a second."); return; }
  const r = resolveQ(raw);
  const obj = { kind: r.kind, title: r.title || raw, category: r.category, due: r.kind === "idea" ? null : r.due, time: r.kind === "idea" ? null : r.time, done: false, doneAt: null, createdAt: Date.now(), raw, manual: st.chip !== "auto", ai: false };
  const id = store.newId(); store.set(id, obj);
  qInput.value = ""; updateHint();
  toast(`Added to ${obj.kind === "idea" ? "Ideas" : CATS[obj.category]}${obj.due ? " · " + fmtDue(obj.due, obj.time) : ""}`, "Undo", () => store.remove(id));
  pulse(obj.kind === "idea" ? "ideas" : "todo");
  refine(id, obj);
});

let toastT;
function toast(msg, label, fn) {
  const t = $("#toast"); clearTimeout(toastT);
  t.innerHTML = `<span></span>${label ? `<button type="button">${esc(label)}</button>` : ""}`;
  t.firstChild.textContent = msg; t.hidden = false;
  if (label) t.querySelector("button").onclick = () => { t.hidden = true; fn(); };
  toastT = setTimeout(() => t.hidden = true, label ? 5000 : 3600);
}
$("#vIsland").onclick = () => closePanel();
$("#vList").onclick = () => openPanel("todo", true);
sheet.addEventListener("click", e => {
  const a = e.target.closest("[data-act]"); if (!a) return;
  const act = a.dataset.act, row = a.closest("[data-id]"), id = row && row.dataset.id, it = id && st.items.get(id);
  if (act === "close") return closePanel();
  if (act === "filter") { st.filter = a.dataset.f; return renderPanel(); }
  if (act === "showdone") { st.showDone = !st.showDone; return renderPanel(); }
  if (act === "btab") { st.bTab = a.dataset.t; $("#shBody").scrollTop = 0; return renderPanel(); }
  if (act === "bsub") { st.bSub = a.dataset.s; return renderPanel(); }
  if (act === "blead") { st.bLead = a.dataset.k; return renderPanel(); }
  if (!it) return;
  if (act === "toggle") { const done = !it.done; store.update(id, { done, doneAt: done ? Date.now() : null }); if (done) { pulse("todo"); toast("Done: " + it.title, "Undo", () => store.update(id, { done: false, doneAt: null })); } }
  else if (act === "edit") { st.edit = st.edit === id ? null : id; renderPanel(); const t = $("#ed-title"); if (t) t.focus(); }
  else if (act === "setcat") { row.querySelectorAll("[data-act=setcat]").forEach(c => c.setAttribute("aria-checked", String(c === a))); row.dataset.cat = a.dataset.cat; }
  else if (act === "save") {
    const title = $("#ed-title").value.trim() || it.title;
    const patch = { title, due: $("#ed-due").value || null, time: $("#ed-time").value || null, category: row.dataset.cat || it.category, edited: true };
    st.edit = null; a.blur(); store.update(id, patch);
  }
  else if (act === "cancel") { st.edit = null; a.blur(); renderPanel(); }
  else if (act === "del") { st.edit = null; a.blur(); const copy = { ...it }; store.remove(id); toast("Deleted", "Undo", () => store.set(id, copy)); }
  else if (act === "toidea") { st.edit = null; a.blur(); store.update(id, { kind: "idea", due: null, time: null, edited: true }); toast("Moved to Ideas"); pulse("ideas"); }
  else if (act === "totodo") { store.update(id, { kind: "todo", category: it.category || "misc", edited: true }); toast("Now a to-do in Task HQ"); pulse("todo"); }
  else if (act === "steps") ideaSteps(id);
});
sheet.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.closest(".edit input")) { e.preventDefault(); const s = sheet.querySelector("[data-act=save]"); s && s.click(); } });
document.addEventListener("keydown", e => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || "");
  if (e.key === "Escape") { if (typing) document.activeElement.blur(); else if (st.panel) closePanel(); return; }
  if (typing) return;
  if ((e.key === "n" || e.key === "/") && !e.metaKey && !e.ctrlKey) { e.preventDefault(); qInput.focus(); }
  else if (e.key === "+" || e.key === "=") zoomAt(vw() / 2, vh() / 2, .8);
  else if (e.key === "-") zoomAt(vw() / 2, vh() / 2, 1.25);
  else if (e.key === "0") flyTo(fitCam(FIT));
  else if (e.key.startsWith("Arrow") && !e.target.closest("#sheet")) { e.preventDefault(); const m = 90;
    panBy(e.key === "ArrowLeft" ? -m : e.key === "ArrowRight" ? m : 0, e.key === "ArrowUp" ? -m : e.key === "ArrowDown" ? m : 0); }
});
new ResizeObserver(() => document.documentElement.style.setProperty("--qh", $("#quick").offsetHeight + "px")).observe($("#quick"));

/* boot */
drawScene(); buildLabels();
cam = fitCam(FIT); applyCam(true);
tickClock(); updateHint(); render();
setInterval(tickClock, 30000);
let startView = "island"; try { startView = localStorage.getItem("island.view") || "island"; } catch (e) {}
if (startView === "list") openPanel("todo", true);
initData();
})();
</script>
