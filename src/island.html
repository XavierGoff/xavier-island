<title>Xavier's Island</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Tilt+Neon&display=swap">
<style>
/* Layout: a pannable floating sky-island (brass by day, neon by night) with an engineer's HUD: plaque bar, quick-add console, building sheet. */
:root{
  --ink:#1f1b16; --ink-2:#5a5247; --ink-3:#8a8173;
  --panel:#eef1ef; --panel-2:#e1e6e3; --line:#cbd2ce; --hud:rgba(238,241,239,.9);
  --brass:#9c6c1c; --brass-hi:#d8ab52; --brass-lo:#5e3f12; --iron:#2a2e33;
  --accent:#0a8597; --accent-ink:#ffffff; --alert:#c4312f; --focus:#0a8597;
  --c-academic:#1f6fbf; --c-fitness:#c2325f; --c-daily:#a8740a; --c-misc:#1f7f6c; --c-idea:#a87c06;
  --b-todo:#9c6c1c; --b-cal:#b02f6b; --b-mail:#0a8597; --b-ideas:#a87c06;
  --bg:#c9d9dc;
  --plaque-a:#efcf86; --plaque-b:#b98a35; --plaque-c:#7d561c; --plaque-ink:#2a1b07; --plaque-edge:#3a2810;
  --f-display:"Big Shoulders Display","Oswald","Arial Narrow",Impact,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r-lg:16px; --r-md:11px;
  --shadow:0 14px 34px rgba(18,14,8,.24),0 2px 6px rgba(18,14,8,.14);
  --qh:118px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ink:#efe6d3; --ink-2:#b4a790; --ink-3:#847965;
  --panel:#16130f; --panel-2:#221d17; --line:#3a3128; --hud:rgba(22,19,15,.88);
  --brass:#d6a64e; --brass-hi:#f0cd84; --brass-lo:#7a5520;
  --accent:#3fe0f0; --accent-ink:#071417; --alert:#ff5f5f; --focus:#3fe0f0;
  --c-academic:#5ec4ff; --c-fitness:#ff5f9e; --c-daily:#ffc24d; --c-misc:#4fe3bf; --c-idea:#ffd45a;
  --b-todo:#e0b35e; --b-cal:#ff5fae; --b-mail:#3fe0f0; --b-ideas:#ffd45a;
  --shadow:0 14px 34px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.4); color-scheme:dark }}
:root[data-theme="dark"]{
  --ink:#efe6d3; --ink-2:#b4a790; --ink-3:#847965;
  --panel:#16130f; --panel-2:#221d17; --line:#3a3128; --hud:rgba(22,19,15,.88);
  --brass:#d6a64e; --brass-hi:#f0cd84; --brass-lo:#7a5520;
  --accent:#3fe0f0; --accent-ink:#071417; --alert:#ff5f5f; --focus:#3fe0f0;
  --c-academic:#5ec4ff; --c-fitness:#ff5f9e; --c-daily:#ffc24d; --c-misc:#4fe3bf; --c-idea:#ffd45a;
  --b-todo:#e0b35e; --b-cal:#ff5fae; --b-mail:#3fe0f0; --b-ideas:#ffd45a;
  --shadow:0 14px 34px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.4); color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}

/* ---------- scene ---------- */
#world{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
#stage{position:absolute;inset:0;touch-action:none;cursor:grab;transition:right .35s ease,filter .35s ease}
#stage.dragging{cursor:grabbing}
#scene{display:block;width:100%;height:100%;overflow:visible}
.o{stroke:#1a120c;stroke-width:1.1;stroke-linejoin:round}
.on{stroke:#1a120c;stroke-width:1;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.cl{fill:var(--cloud,#fff)}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 18s linear infinite}
.ccw{animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.prop{transform-box:fill-box;transform-origin:center;animation:prop .32s linear infinite}
@keyframes prop{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.12)}}
.steam{transform-box:fill-box;transform-origin:center;animation:steam 4.2s ease-out infinite;opacity:0;fill:var(--steam,#f3f0ea)}
@keyframes steam{0%{transform:translate(0,0) scale(.5);opacity:0}15%{opacity:.8}100%{transform:translate(16px,-80px) scale(2.6);opacity:0}}
.bob{animation:bob 7s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.sway{animation:sway 40s ease-in-out infinite alternate}
@keyframes sway{to{transform:translateX(60px)}}
.blink{animation:blink 2.2s steps(1) infinite}
@keyframes blink{50%{opacity:.15}}
.twinkle{animation:tw 3.5s ease-in-out infinite}
@keyframes tw{50%{opacity:.3}}
.flick{animation:flick 6s linear infinite}
@keyframes flick{0%,40%,44%,100%{opacity:1}42%{opacity:.4}}
#lit{opacity:var(--lights,0);transition:opacity 1.5s;pointer-events:none}
.plot{cursor:pointer}
.ntxt{font-family:"Tilt Neon","Big Shoulders Display",sans-serif}
.bldg{cursor:pointer}

/* plaques (labels) */
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;pointer-events:auto;border:1.5px solid var(--plaque-edge);border-radius:6px;padding:5px 16px 4px;
  background:linear-gradient(180deg,var(--plaque-a),var(--plaque-b) 55%,var(--plaque-c));color:var(--plaque-ink);
  font:800 15px/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;cursor:pointer;
  box-shadow:0 2px 0 var(--plaque-edge),0 8px 16px rgba(10,6,2,.35);transition:box-shadow .3s,translate .18s,scale .18s;will-change:transform}
.lbl::before,.lbl::after{content:"";position:absolute;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3cf,#6e4b16 70%)}
.lbl::before{left:5px}.lbl::after{right:5px}
.lbl:hover,.lbl.hot{translate:0 -3px}
.lbl.sel{box-shadow:0 2px 0 var(--plaque-edge),0 0 0 3px var(--glow),0 8px 18px rgba(10,6,2,.4)}
.night .lbl{box-shadow:0 2px 0 var(--plaque-edge),0 0 14px var(--glow),0 0 2px var(--glow)}
.lbl .bub{position:absolute;top:-10px;right:-10px;min-width:22px;height:22px;padding:0 5px;border-radius:11px;display:grid;place-items:center;
  font:600 12px/1 var(--f-mono);letter-spacing:0;color:#fff;background:radial-gradient(circle at 35% 30%,#ff8a7a,#c41d2a 60%,#7a0d16);border:1.5px solid #2a0a0a;box-shadow:0 0 10px rgba(255,60,60,.6)}
.lbl.pop{animation:lpop .55s cubic-bezier(.3,1.6,.5,1)}
@keyframes lpop{35%{scale:1.18}}

/* map controls */
.mapctl{position:fixed;z-index:22;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(var(--qh) + 12px);display:grid;gap:6px}
.mapctl button{width:40px;height:40px;border-radius:11px;border:1.5px solid var(--line);background:var(--hud);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:var(--shadow);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.mapctl button:hover{border-color:var(--brass)}
@media (max-width:720px){.mapctl{display:none}}

/* ---------- HUD top ---------- */
.hud-top{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.pill{pointer-events:auto;background:var(--hud);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:12px;box-shadow:var(--shadow);border:1.5px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:12px;padding:8px 14px;min-width:0}
.brand b{font:800 21px/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.brand b i{font-style:normal;color:var(--brass)}
.brand span{font:500 12.5px var(--f-mono);color:var(--ink-2);white-space:nowrap}
.seg{display:flex;padding:4px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:8px;font:700 13px var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
@media (max-width:440px){.brand span{display:none}.brand b{font-size:17px;letter-spacing:.06em}}

/* ---------- quick add ---------- */
#quick{position:fixed;left:0;right:0;bottom:0;z-index:30;pointer-events:none;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.qcard{pointer-events:auto;max-width:720px;margin:0 auto;background:var(--panel);border:1.5px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:10px;display:grid;grid-template-columns:minmax(0,1fr);gap:9px;position:relative}
.qcard::before{content:"";position:absolute;inset:-1.5px;border-radius:inherit;border-top:2px solid var(--brass);pointer-events:none;opacity:.8}
.qrow{display:flex;gap:8px}
#qInput{flex:1;min-width:0;font:500 16px var(--f-body);padding:12px 14px;border-radius:var(--r-md);border:1.5px solid var(--line);background:var(--panel-2);color:var(--ink)}
#qInput::placeholder{color:var(--ink-3)}
#qInput:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.btn-go{font:800 18px var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--plaque-ink);border:1.5px solid var(--plaque-edge);border-radius:var(--r-md);padding:0 20px;cursor:pointer;
  background:linear-gradient(180deg,var(--plaque-a),var(--plaque-b) 55%,var(--plaque-c));box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 2px 0 var(--plaque-edge)}
.btn-go:active{translate:0 2px;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.qmeta{display:flex;align-items:center;gap:10px;min-width:0}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:600 13px var(--f-body);padding:5px 11px;border-radius:8px;border:1.5px solid var(--line);background:transparent;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--ink-3));box-shadow:0 0 0 2px color-mix(in srgb,var(--c,var(--ink-3)) 25%,transparent)}
.chip[aria-checked="true"]{border-color:var(--c,var(--ink));color:var(--ink);background:color-mix(in srgb,var(--c,var(--ink)) 13%,transparent)}
.chip .n{font:600 12px var(--f-mono);color:var(--ink-3)}
#qHint{font:500 12.5px var(--f-mono);color:var(--ink-2);white-space:nowrap;flex:none}
#qHint b{color:var(--ink);font-weight:600}
@media (max-width:600px){.qmeta{flex-direction:column;align-items:stretch;gap:6px}#qHint{white-space:normal;min-height:1.2em}}

/* ---------- sheet ---------- */
#sheet{position:fixed;z-index:25;top:calc(env(safe-area-inset-top,0px) + 68px);right:max(16px,env(safe-area-inset-right,0px));bottom:calc(var(--qh) + 6px);
  width:min(440px,calc(100vw - 32px));background:var(--panel);border:1.5px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;animation:sheetIn .24s cubic-bezier(.2,1.2,.4,1)}
#sheet.wide{right:auto;left:50%;transform:translateX(-50%);width:min(760px,calc(100vw - 32px))}
@keyframes sheetIn{from{translate:0 14px;opacity:0}to{translate:0 0;opacity:1}}
@media (min-width:721px){#app.sheet-open:not(.wide-open) #stage{right:calc(min(440px,100vw - 32px) + 20px)}}
#app.wide-open #stage{filter:saturate(.7) brightness(.75)}
@media (max-width:720px){
  #sheet,#sheet.wide{top:calc(env(safe-area-inset-top,0px) + 34vh);left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));width:auto;transform:none}
  #sheet.wide{top:calc(env(safe-area-inset-top,0px) + 64px)}
}
.sh-head{display:flex;align-items:center;gap:12px;padding:14px 12px 12px 16px;border-bottom:1.5px solid var(--line);
  background:radial-gradient(circle at 7px 7px,var(--brass) 1.6px,transparent 2.2px),radial-gradient(circle at calc(100% - 7px) 7px,var(--brass) 1.6px,transparent 2.2px),linear-gradient(180deg,color-mix(in srgb,var(--c) 9%,transparent),transparent)}
.sh-icon{flex:none;width:42px;height:42px;border-radius:10px;display:grid;place-items:center;color:var(--c);border:1.5px solid color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 12%,transparent)}
.sh-title{font:800 26px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase}
.sh-sub{font:500 12.5px var(--f-mono);color:var(--ink-2);margin-top:4px}
.icon-btn{margin-left:auto;flex:none;width:38px;height:38px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel-2);display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.icon-btn:hover{color:var(--ink);border-color:var(--brass)}
.sh-body{flex:1;min-height:0;overflow:auto;padding:12px 14px 22px;overscroll-behavior:contain}

/* lists */
ul{list-style:none;margin:0;padding:0}
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 6px}
.grp{margin-top:12px}
.grp-h{display:flex;align-items:baseline;gap:8px;font:700 13px var(--f-display);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);padding:0 6px 4px}
.grp-h.over{color:var(--alert)}
.grp-h .n{font:600 11.5px var(--f-mono);letter-spacing:0}
.item{display:grid;grid-template-columns:28px minmax(0,1fr);align-items:start;gap:10px;padding:9px 8px;border-radius:10px}
.item:hover{background:var(--panel-2)}
.ck{margin-top:1px;width:24px;height:24px;border-radius:50%;border:2px solid var(--c);background:transparent;display:grid;place-items:center;cursor:pointer;padding:0;color:var(--c);box-shadow:inset 0 0 0 2px var(--panel)}
.ck svg{opacity:0;transition:opacity .15s}
.ck:hover svg{opacity:.45}
.item.done .ck{background:var(--c);color:var(--panel)}
.item.done .ck svg{opacity:1}
.ttl{display:block;width:100%;background:none;border:0;text-align:left;font:500 15px/1.35 var(--f-body);color:var(--ink);cursor:pointer;padding:0;overflow-wrap:anywhere}
.item.done .ttl{text-decoration:line-through;color:var(--ink-3)}
.meta{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:5px;font-size:12px;color:var(--ink-2)}
.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:6px;background:var(--panel-2);font-weight:600;white-space:nowrap}
.tag.t{font:500 11.5px var(--f-mono)}
.item:hover .tag{background:var(--panel)}
.tag.over{color:var(--alert)}
.tag.ex{border:1.5px dashed var(--ink-3);background:transparent}
.cat-dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.ai{color:var(--accent);display:inline-flex}
.edit{background:var(--panel-2);border-radius:12px;padding:12px;margin:2px 0 8px;display:grid;gap:10px;border:1.5px solid var(--line)}
.edit label{font:700 12px var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);display:grid;gap:5px}
.edit input{font:500 15px var(--f-body);padding:9px 11px;border-radius:9px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);min-width:0;width:100%}
.edit .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.edit .acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1.5px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 13px;font-weight:600;font-size:13.5px;cursor:pointer}
.btn:hover{border-color:var(--brass)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--alert)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn:disabled{opacity:.55;cursor:default}
.empty{padding:26px 10px;text-align:center;color:var(--ink-2);line-height:1.5}
.empty b{display:block;font:800 21px var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);margin-bottom:4px}
.done-toggle{margin-top:14px;width:100%;text-align:left;border:0;background:transparent;padding:8px 6px;font:700 13px var(--f-display);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);cursor:pointer}
.banner{font-size:13px;line-height:1.45;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--brass) 14%,transparent);border:1px solid color-mix(in srgb,var(--brass) 35%,transparent);margin-bottom:8px}
.sec-h{font:700 13px var(--f-display);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin:18px 6px 8px;display:flex;gap:8px;align-items:center}
.sec-h:first-child{margin-top:4px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.day{border-radius:10px;background:var(--panel-2);padding:8px 2px;text-align:center;display:grid;gap:3px;justify-items:center;border:1.5px solid transparent}
.day.today{border-color:var(--b-cal)}
.day small{font:700 12px var(--f-display);letter-spacing:.1em;color:var(--ink-3);text-transform:uppercase}
.day strong{font:600 17px var(--f-mono)}
.dots{display:flex;gap:2px;min-height:6px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.trow{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;padding:9px 6px;border-radius:10px;align-items:baseline}
.trow time{font:600 12.5px var(--f-mono);color:var(--ink-2)}
.trow .t{overflow-wrap:anywhere}
.soon{border:1.5px dashed var(--line);border-radius:14px;padding:14px;margin-top:18px}
.soon h4{margin:0 0 4px;font:800 19px var(--f-display);letter-spacing:.08em;text-transform:uppercase}
.soon p{margin:0 0 10px;color:var(--ink-2);line-height:1.5;font-size:14px}
.ghost{opacity:.6}
.mail{border-radius:12px;background:var(--panel-2);padding:11px 12px;margin-bottom:8px}
.mail .from{font-weight:700;font-size:13.5px}
.mail .sub{font-size:14px;margin-top:2px}
.mail .why{font-size:12.5px;color:var(--ink-2);margin-top:4px}
.idea{border-radius:14px;background:var(--panel-2);padding:12px 12px 10px;margin-bottom:10px;border:1.5px solid var(--line)}
.idea h4{margin:0;font:600 15.5px/1.35 var(--f-body);overflow-wrap:anywhere}
.idea .when{font:500 12px var(--f-mono);color:var(--ink-3);margin-top:3px}
.idea ol{margin:8px 0 2px;padding-left:20px;font-size:14px;line-height:1.45;color:var(--ink-2)}
.idea .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.idea .btn{padding:6px 11px;font-size:13px}
.loading{padding:30px 10px;text-align:center;color:var(--ink-2)}

#toast{position:fixed;left:50%;bottom:calc(var(--qh) + 14px);translate:-50% 0;z-index:40;background:var(--ink);color:var(--panel);border-radius:12px;padding:10px 10px 10px 16px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);font-weight:600;font-size:14px;max-width:calc(100vw - 32px);animation:sheetIn .2s ease}
#toast button{border:0;background:color-mix(in srgb,var(--panel) 18%,transparent);color:var(--panel);font-weight:700;border-radius:8px;padding:6px 11px;cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<div id="app">
  <div id="world">
    <div id="stage">
      <svg id="scene" viewBox="170 -40 1080 900" preserveAspectRatio="none" aria-hidden="true"></svg>
      <div id="labels"></div>
    </div>
  </div>

  <header class="hud-top">
    <div class="pill brand"><b>Xavier's <i>Island</i></b><span id="today"></span></div>
    <div class="pill seg" role="group" aria-label="View">
      <button id="vIsland" aria-pressed="true">Island</button>
      <button id="vList" aria-pressed="false">List</button>
    </div>
  </header>

  <div class="mapctl" aria-label="Map controls">
    <button id="zIn" aria-label="Zoom in"><svg width="16" height="16" viewBox="0 0 16 16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg></button>

const pad = n => String(n).padStart(2, "0");

  x: '<svg width="18" height="18" viewBox="0 0 18 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="m4 4 10 10M14 4 4 14"/></svg>'
};
const TICK = '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 7.4l2.7 2.7L11.2 4.4" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const SPARK = '<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 0l1.4 4.6L12 6l-4.6 1.4L6 12l-1.4-4.6L0 6l4.6-1.4z" fill="currentColor"/></svg>';
const BINFO = {
  todo: { t: "To-dos", s: "Guildhall", c: "var(--b-todo)" },
  cal: { t: "Calendar", s: "Clock Tower", c: "var(--b-cal)" },
  mail: { t: "Mail", s: "Pneumatic Post", c: "var(--b-mail)" },
  ideas: { t: "Ideas", s: "Lightbulb Airship", c: "var(--b-ideas)" }
};
const todos = () => [...st.items].filter(([, it]) => it.kind !== "idea");
const ideas = () => [...st.items].filter(([, it]) => it.kind === "idea").sort((a, b) => b[1].createdAt - a[1].createdAt);
const sortT = (a, b) => (a[1].due || "9999").localeCompare(b[1].due || "9999") || (a[1].time || "99").localeCompare(b[1].time || "99") || a[1].createdAt - b[1].createdAt;
const dueNowCount = () => todos().filter(([, it]) => !it.done && it.due && dayDiff(it.due) <= 0).length;

const sheet = $("#sheet");
function itemHTML(id, it) {
  const n = it.due ? dayDiff(it.due) : null, over = !it.done && n !== null && n < 0;
  const meta = [
    it.due || it.time ? `<span class="tag t${over ? " over" : ""}">${esc(fmtDue(it.due, it.time))}</span>` : "",
    `<span class="tag"><i class="cat-dot"></i>${CATS[it.category] || "Misc"}</span>`,
    it.example ? `<span class="tag ex">Example</span>` : "",
    it.ai ? `<span class="ai" title="Tidied up by Claude">${SPARK}<span class="sr">Tidied up by Claude</span></span>` : ""
  ].join("");
  let h = `<li class="item${it.done ? " done" : ""}" data-id="${id}" style="--c:var(--c-${CATS[it.category] ? it.category : "misc"})">
    <button class="ck" data-act="toggle" aria-label="${it.done ? "Mark not done" : "Mark done"}: ${esc(it.title)}">${TICK}</button>
    <div><button class="ttl" data-act="edit" aria-expanded="${st.edit === id}">${esc(it.title)}</button><div class="meta">${meta}</div></div></li>`;
  if (st.edit === id) h += `<li class="edit" data-id="${id}">
    <label>Task<input id="ed-title" value="${esc(it.title)}" maxlength="140"></label>
    <div class="chips" role="radiogroup" aria-label="Category">${Object.entries(CATS).map(([k, v]) => `<button class="chip" role="radio" data-act="setcat" data-cat="${k}" aria-checked="${it.category === k}" style="--c:var(--c-${k})"><i class="dot"></i>${v}</button>`).join("")}</div>
    <div class="row"><label>Date<input id="ed-due" type="date" value="${it.due || ""}"></label><label>Time<input id="ed-time" type="time" value="${it.time || ""}"></label></div>
    <div class="acts"><button class="btn primary" data-act="save">Save</button><button class="btn" data-act="toidea">Move to Ideas</button><button class="btn danger" data-act="del">Delete</button><button class="btn ghost" data-act="cancel">Cancel</button></div></li>`;
  return h;
}
function todoBody() {
  const all = todos(), open = all.filter(([, it]) => !it.done);
  const counts = { all: open.length }; Object.keys(CATS).forEach(k => counts[k] = open.filter(([, it]) => it.category === k).length);
  const f = st.filter;
  let h = st.mode === "demo" ? `<div class="banner">Preview mode. Open this from your Claude account to save your own to-dos. The items below are examples.</div>` : "";
  h += `<div class="filters" role="radiogroup" aria-label="Filter">` +
    [["all", "All"], ...Object.entries(CATS)].map(([k, v]) => `<button class="chip" role="radio" data-act="filter" data-f="${k}" aria-checked="${f === k}" ${k !== "all" ? `style="--c:var(--c-${k})"` : ""}>${k !== "all" ? '<i class="dot"></i>' : ""}${v} <span class="n">${counts[k]}</span></button>`).join("") + `</div>`;
  const vis = open.filter(([, it]) => f === "all" || it.category === f).sort(sortT);
  const G = [["over", "Overdue", n => n < 0], ["today", "Today", n => n === 0], ["tom", "Tomorrow", n => n === 1], ["week", "This week", n => n > 1 && n <= 7], ["later", "Later", n => n > 7], ["none", "Anytime", null]];
  if (!vis.length) h += `<div class="empty"><b>${all.length ? "All clear" : "Nothing here yet"}</b>${all.length ? "Nothing open" + (f !== "all" ? " in " + CATS[f] : "") + ". Enjoy it." : "Type in the bar below and press Enter. Try “problem sheet due fri” or “gym legs tomorrow 7am”."}</div>`;
  for (const [k, label, test] of G) {
    const rows = vis.filter(([, it]) => test ? it.due && test(dayDiff(it.due)) : !it.due);
    if (!rows.length) continue;
    h += `<section class="grp"><div class="grp-h${k === "over" ? " over" : ""}">${label} <span class="n">${rows.length}</span></div><ul>${rows.map(([id, it]) => itemHTML(id, it)).join("")}</ul></section>`;
  }
  const done = all.filter(([, it]) => it.done && (f === "all" || it.category === f) && Date.now() - (it.doneAt || 0) < 7 * 864e5).sort((a, b) => (b[1].doneAt || 0) - (a[1].doneAt || 0));
  if (done.length) {
    h += `<button class="done-toggle" data-act="showdone" aria-expanded="${st.showDone}">${st.showDone ? "▾" : "▸"} Done this week · ${done.length}</button>`;
    if (st.showDone) h += `<ul>${done.map(([id, it]) => itemHTML(id, it)).join("")}</ul>`;
  }
  return h;
}
function calBody() {
  const t = midnight(), all = todos().filter(([, it]) => !it.done && it.due);
  let h = `<h3 class="sec-h">Next 7 days</h3><div class="week">`;
  for (let i = 0; i < 7; i++) {
    const d = addDays(t, i), k = isoD(d), its = all.filter(([, it]) => it.due === k);
    h += `<div class="day${i === 0 ? " today" : ""}"><small>${d.toLocaleDateString("en-GB", { weekday: "short" })}</small><strong>${d.getDate()}</strong><span class="dots">${its.slice(0, 4).map(([, it]) => `<i style="--c:var(--c-${it.category})"></i>`).join("")}</span></div>`;
  }
  h += `</div><h3 class="sec-h">Today from your to-dos</h3>`;
  const today = all.filter(([, it]) => it.due === isoD(t)).sort(sortT);
  h += today.length ? today.map(([, it]) => `<div class="trow"><time>${it.time || "Any time"}</time><span class="t">${esc(it.title)}</span></div>`).join("") : `<div class="empty" style="padding:12px">Nothing due today.</div>`;
  h += `<div class="soon"><h4>Outlook comes next</h4><p>The next build connects your Imperial and personal Outlook calendars, plus your Outlook reminders, so your whole day shows here.</p>
    <div class="ghost"><div class="trow"><time>09:00</time><span class="t">Lecture <span class="tag ex">Example</span></span></div><div class="trow"><time>14:00</time><span class="t">Design studio <span class="tag ex">Example</span></span></div><div class="trow"><time>18:30</time><span class="t">Reminder: pack gym bag <span class="tag ex">Example</span></span></div></div></div>`;
  return h;
}
function mailBody() {
  return `<div class="soon" style="margin-top:4px"><h4>Opening soon</h4><p>The Pneumatic Post will read Gmail and Outlook each morning, pull out what needs you, and sum up everything else in a few lines. Below is how it will look.</p></div>
  <h3 class="sec-h">Needs you <span class="tag ex">Example</span></h3>
  <div class="mail ghost"><div class="from">Module leader</div><div class="sub">Coursework brief updated</div><div class="why">Deadline moved a week later. Worth checking the new marking scheme.</div></div>
  <div class="mail ghost"><div class="from">Project group</div><div class="sub">Can we meet Thursday?</div><div class="why">Asks for your availability. Needs a reply.</div></div>
  <h3 class="sec-h">Everything else <span class="tag ex">Example</span></h3>
  <p class="ghost" style="margin:0 6px;line-height:1.55;color:var(--ink-2)">6 newsletters, 2 delivery updates and a society event invite. Nothing urgent.</p>`;
}
function ideasBody() {
  const list = ideas();
  let h = st.mode === "demo" ? `<div class="banner">Preview mode. The idea below is an example.</div>` : "";
  if (!list.length) return h + `<div class="empty"><b>No ideas aboard yet</b>Start a note with “idea:” or pick the Idea chip below, then press Enter.</div>`;
  return h + list.map(([id, it]) => `<article class="idea" data-id="${id}"><h4>${esc(it.title)}</h4><div class="when">${new Date(it.createdAt).toLocaleDateString("en-GB", { day: "numeric", month: "short" })}${it.example ? ' · <span class="tag ex">Example</span>' : ""}</div>
    ${Array.isArray(it.steps) && it.steps.length ? `<ol>${it.steps.map(s => `<li>${esc(s)}</li>`).join("")}</ol>` : ""}
    <div class="acts">${sample && !st.aiOff ? `<button class="btn" data-act="steps" ${st.busy.has(id) ? "disabled" : ""}>${st.busy.has(id) ? "Thinking…" : it.steps ? "New next steps" : "Next steps"}</button>` : ""}<button class="btn" data-act="totodo">Make it a to-do</button><button class="btn danger" data-act="del">Delete</button></div></article>`).join("");
}
function sheetSub(b) {
  if (b === "todo") { const n = dueNowCount(), o = todos().filter(([, it]) => !it.done).length; return `${BINFO.todo.s} · ${o} open${n ? ` · ${n} due now` : ""}`; }
  if (b === "ideas") { const n = ideas().length; return `${BINFO.ideas.s} · ${n} idea${n === 1 ? "" : "s"}`; }
  return BINFO[b].s;
}
function openPanel(b, wide = false) {
  st.panel = b; st.wide = wide; st.edit = null;
  sheet.hidden = false; sheet.classList.toggle("wide", wide);
  sheet.style.setProperty("--c", BINFO[b].c);
  sheet.innerHTML = `<div class="sh-head"><div class="sh-icon">${ICON[b]}</div><div><div class="sh-title" id="shTitle">${BINFO[b].t}</div><div class="sh-sub" id="shSub"></div></div><button class="icon-btn" data-act="close" aria-label="Close">${ICON.x}</button></div><div class="sh-body" id="shBody"></div>`;
  $("#app").classList.add("sheet-open"); $("#app").classList.toggle("wide-open", wide);
  $("#vIsland").setAttribute("aria-pressed", String(!wide)); $("#vList").setAttribute("aria-pressed", String(wide));
  setChip(b === "ideas" ? "idea" : "auto");
  Object.values(labelEls).forEach(l => l.classList.toggle("sel", l.dataset.b === b && !wide));
  if (!wide) setTimeout(() => flyToBuilding(b), 30);
  renderPanel();
  try { localStorage.setItem("island.view", wide ? "list" : "island"); } catch (e) {}
}
function closePanel() {
  st.panel = null; st.edit = null; sheet.hidden = true; sheet.innerHTML = "";
  $("#app").classList.remove("sheet-open", "wide-open");
  $("#vIsland").setAttribute("aria-pressed", "true"); $("#vList").setAttribute("aria-pressed", "false");
  setChip("auto"); Object.values(labelEls).forEach(l => l.classList.remove("sel"));
  try { localStorage.setItem("island.view", "island"); } catch (e) {}
}
function renderPanel() {
  if (!st.panel) return;
  const body = $("#shBody"); if (!body) return;
  const a = document.activeElement;
  if (a && body.contains(a) && a.tagName === "INPUT") return;
  $("#shSub").textContent = st.mode === "loading" ? BINFO[st.panel].s : sheetSub(st.panel);
  if (st.mode === "loading" && (st.panel === "todo" || st.panel === "ideas")) { body.innerHTML = `<div class="loading">Opening your island…</div>`; return; }
  const top = body.scrollTop;
  body.innerHTML = st.panel === "todo" ? todoBody() : st.panel === "cal" ? calBody() : st.panel === "mail" ? mailBody() : ideasBody();
  body.scrollTop = top;
}
function setBubble(b, n) { const l = labelEls[b]; if (!l) return; const bub = l.querySelector(".bub"); bub.textContent = n > 99 ? "99+" : String(n); bub.hidden = !(n > 0); }
function pulse(b) { const l = labelEls[b]; if (!l) return; l.classList.remove("pop"); void l.offsetWidth; l.classList.add("pop"); }
function render() {
  const loading = st.mode === "loading", ni = ideas().length, dn = dueNowCount();
  setBubble("todo", loading ? 0 : dn); setBubble("ideas", loading ? 0 : ni);
  const halo = $("#halo"); if (halo) halo.setAttribute("opacity", r1(Math.min(1, .2 + ni * .15)));
  if (labelEls.todo) labelEls.todo.setAttribute("aria-label", `Open To-dos. ${dn} due now.`);
  renderPanel();
}

/* quick add */
const qInput = $("#qInput"), qHint = $("#qHint");
const CHIPS = [["auto", "Auto", null], ["academic", "Academic", "var(--c-academic)"], ["fitness", "Fitness", "var(--c-fitness)"], ["daily", "Daily", "var(--c-daily)"], ["misc", "Misc", "var(--c-misc)"], ["idea", "Idea", "var(--c-idea)"]];
$("#qChips").innerHTML = CHIPS.map(([k, v, c]) => `<button type="button" class="chip" role="radio" data-chip="${k}" aria-checked="${k === "auto"}" ${c ? `style="--c:${c}"` : ""}>${c ? '<i class="dot"></i>' : SPARK}${v}</button>`).join("");
function setChip(k) { st.chip = k; document.querySelectorAll("#qChips .chip").forEach(b => b.setAttribute("aria-checked", String(b.dataset.chip === k))); updateHint(); }
function resolveQ(raw) {
  const p = parseQuick(raw); let kind = p.kind, category = p.category;
  if (st.chip === "idea") kind = "idea"; else if (st.chip !== "auto") { kind = "todo"; category = st.chip; }
  return { ...p, kind, category };
}
function updateHint() {
  const raw = qInput.value.trim();
  if (!raw) { qHint.innerHTML = st.chip === "auto" ? `Claude sorts it for you` : `Goes to <b>${st.chip === "idea" ? "Ideas" : CATS[st.chip]}</b>`; return; }
  const r = resolveQ(raw);
  qHint.innerHTML = `→ <b>${r.kind === "idea" ? "Ideas" : CATS[r.category]}</b>${r.kind !== "idea" && (r.due || r.time) ? " · " + esc(fmtDue(r.due, r.time)) : ""}`;
}
$("#qChips").addEventListener("click", e => { const b = e.target.closest("[data-chip]"); if (b) { setChip(b.dataset.chip); qInput.focus(); } });
qInput.addEventListener("input", updateHint);
$("#quick").addEventListener("submit", e => {
  e.preventDefault();
  const raw = qInput.value.trim(); if (!raw) { qInput.focus(); return; }
  if (st.mode === "loading") { toast("Still opening your island. Try again in a second."); return; }
  const r = resolveQ(raw);
  const obj = { kind: r.kind, title: r.title || raw, category: r.category, due: r.kind === "idea" ? null : r.due, time: r.kind === "idea" ? null : r.time, done: false, doneAt: null, createdAt: Date.now(), raw, manual: st.chip !== "auto", ai: false };
  const id = store.newId(); store.set(id, obj);
  qInput.value = ""; updateHint();
  toast(`Added to ${obj.kind === "idea" ? "Ideas" : CATS[obj.category]}${obj.due ? " · " + fmtDue(obj.due, obj.time) : ""}`, "Undo", () => store.remove(id));
  pulse(obj.kind === "idea" ? "ideas" : "todo");
  refine(id, obj);
});

let toastT;
function toast(msg, label, fn) {
  const t = $("#toast"); clearTimeout(toastT);
  t.innerHTML = `<span></span>${label ? `<button type="button">${esc(label)}</button>` : ""}`;
  t.firstChild.textContent = msg; t.hidden = false;
  if (label) t.querySelector("button").onclick = () => { t.hidden = true; fn(); };
  toastT = setTimeout(() => t.hidden = true, label ? 5000 : 3600);
}
$("#vIsland").onclick = () => closePanel();
$("#vList").onclick = () => openPanel("todo", true);
sheet.addEventListener("click", e => {
  const a = e.target.closest("[data-act]"); if (!a) return;
  const act = a.dataset.act, row = a.closest("[data-id]"), id = row && row.dataset.id, it = id && st.items.get(id);
  if (act === "close") return closePanel();
  if (act === "filter") { st.filter = a.dataset.f; return renderPanel(); }
  if (act === "showdone") { st.showDone = !st.showDone; return renderPanel(); }
  if (!it) return;
  if (act === "toggle") { const done = !it.done; store.update(id, { done, doneAt: done ? Date.now() : null }); if (done) { pulse("todo"); toast("Done: " + it.title, "Undo", () => store.update(id, { done: false, doneAt: null })); } }
  else if (act === "edit") { st.edit = st.edit === id ? null : id; renderPanel(); const t = $("#ed-title"); if (t) t.focus(); }
  else if (act === "setcat") { row.querySelectorAll("[data-act=setcat]").forEach(c => c.setAttribute("aria-checked", String(c === a))); row.dataset.cat = a.dataset.cat; }
  else if (act === "save") {
    const title = $("#ed-title").value.trim() || it.title;
    const patch = { title, due: $("#ed-due").value || null, time: $("#ed-time").value || null, category: row.dataset.cat || it.category, edited: true };
    st.edit = null; a.blur(); store.update(id, patch);
  }
  else if (act === "cancel") { st.edit = null; a.blur(); renderPanel(); }
  else if (act === "del") { st.edit = null; a.blur(); const copy = { ...it }; store.remove(id); toast("Deleted", "Undo", () => store.set(id, copy)); }
  else if (act === "toidea") { st.edit = null; a.blur(); store.update(id, { kind: "idea", due: null, time: null, edited: true }); toast("Moved to Ideas"); pulse("ideas"); }
  else if (act === "totodo") { store.update(id, { kind: "todo", category: it.category || "misc", edited: true }); toast("Now a to-do in the Guildhall"); pulse("todo"); }
  else if (act === "steps") ideaSteps(id);
});
sheet.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.closest(".edit input")) { e.preventDefault(); const s = sheet.querySelector("[data-act=save]"); s && s.click(); } });
document.addEventListener("keydown", e => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || "");
  if (e.key === "Escape") { if (typing) document.activeElement.blur(); else if (st.panel) closePanel(); return; }
  if (typing) return;
  if ((e.key === "n" || e.key === "/") && !e.metaKey && !e.ctrlKey) { e.preventDefault(); qInput.focus(); }
  else if (e.key === "+" || e.key === "=") zoomAt(vw() / 2, vh() / 2, .8);
  else if (e.key === "-") zoomAt(vw() / 2, vh() / 2, 1.25);
});
new ResizeObserver(() => document.documentElement.style.setProperty("--qh", $("#quick").offsetHeight + "px")).observe($("#quick"));

/* boot */
drawScene(); buildLabels();
cam = fitCam(FIT); applyCam();
tickClock(); updateHint(); render();
setInterval(tickClock, 30000);
let startView = "island"; try { startView = localStorage.getItem("island.view") || "island"; } catch (e) {}
if (startView === "list") openPanel("todo", true);
initData();
})();
</script>
