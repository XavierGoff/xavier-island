<title>Xavier's Island</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Lilita+One&display=swap">
<style>
/* Layout: full-bleed isometric island scene; a game-style HUD floats over it (top bar, bottom quick-add, building sheet). */
:root{
  --ink:#1c2233; --ink-2:#566075; --ink-3:#8790a3;
  --panel:#ffffff; --panel-2:#f1f4f9; --line:#e0e5ee; --hud:rgba(255,255,255,.9);
  --go:#3aa845; --go-deep:#277a30; --go-ink:#ffffff;
  --alert:#d93d32; --focus:#1f6fe0;
  --c-academic:#3767dc; --c-fitness:#dc4a36; --c-daily:#c98d06; --c-misc:#8656cf; --c-idea:#d99f00;
  --b-todo:#d9473b; --b-cal:#6b4fc9; --b-mail:#2f6fd0; --b-ideas:#d99f00;
  --bg:#2aa1cc; --plate:#3a3150; --plate-edge:#1e1828;
  --f-display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-lg:20px; --r-md:14px;
  --shadow:0 12px 32px rgba(20,24,44,.2),0 2px 6px rgba(20,24,44,.12);
  --qh:118px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ink:#e9edf5; --ink-2:#a5afc2; --ink-3:#78829a;
  --panel:#171c28; --panel-2:#212839; --line:#2e3649; --hud:rgba(23,28,40,.9);
  --c-academic:#7097ff; --c-fitness:#ff7b63; --c-daily:#f4bd3c; --c-misc:#b48eff; --c-idea:#ffd24d;
  --b-todo:#ff6f60; --b-cal:#a58cff; --b-mail:#6f9dff; --b-ideas:#ffd24d;
  --alert:#ff6b5f; --focus:#80aaff;
  --shadow:0 12px 32px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.35); color-scheme:dark }}
:root[data-theme="dark"]{
  --ink:#e9edf5; --ink-2:#a5afc2; --ink-3:#78829a;
  --panel:#171c28; --panel-2:#212839; --line:#2e3649; --hud:rgba(23,28,40,.9);
  --c-academic:#7097ff; --c-fitness:#ff7b63; --c-daily:#f4bd3c; --c-misc:#b48eff; --c-idea:#ffd24d;
  --b-todo:#ff6f60; --b-cal:#a58cff; --b-mail:#6f9dff; --b-ideas:#ffd24d;
  --alert:#ff6b5f; --focus:#80aaff;
  --shadow:0 12px 32px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.35); color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

/* ---------- scene ---------- */
#world{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
#stage{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 62px);bottom:calc(var(--qh) + 2px);transition:right .35s ease,filter .35s ease}
#scene{display:block;width:100%;height:100%;overflow:visible}
.ol{stroke:#2a2238;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.ol-n{vector-effect:non-scaling-stroke}
.bldg,.plot{cursor:pointer;outline:none}
.lift,.pl-in{transition:transform .22s cubic-bezier(.3,1.5,.5,1)}
.up>.lift,.plate.up .pl-in{transform:translateY(-7px)}
.plate.up .pl-bg{stroke:#fff}
.lit{opacity:var(--lights,0);transition:opacity 1.2s}
.plate text{font-family:var(--f-display);fill:#fff;letter-spacing:.03em}
.pop{animation:pop .55s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:translateY(0)}35%{transform:translateY(-14px)}100%{transform:translateY(0)}}
.bob{animation:bob 6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.flag{transform-box:fill-box;transform-origin:0 50%;animation:wave 2.6s ease-in-out infinite}
@keyframes wave{0%,100%{transform:skewY(0)}50%{transform:skewY(-9deg)}}
.ripple{transform-box:fill-box;transform-origin:center;animation:ripple 7s ease-out infinite;opacity:0}
@keyframes ripple{0%{transform:scale(.97);opacity:0}25%{opacity:.45}100%{transform:scale(1.1);opacity:0}}
.drift{animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-500px)}to{transform:translateX(1500px)}}
.twinkle{animation:tw 3.5s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.35}}

/* ---------- HUD top ---------- */
.hud-top{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.pill{pointer-events:auto;background:var(--hud);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:999px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:baseline;gap:10px;padding:8px 16px 8px 14px;min-width:0}
.brand b{font-family:var(--f-display);font-weight:400;font-size:20px;letter-spacing:.02em;white-space:nowrap}
.brand span{font-size:13px;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.seg{display:flex;padding:4px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:999px;font-weight:700;font-size:13px;color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
@media (max-width:420px){.brand span{display:none}}

/* ---------- quick add ---------- */
#quick{position:fixed;left:0;right:0;bottom:0;z-index:30;pointer-events:none;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.qcard{pointer-events:auto;max-width:720px;margin:0 auto;background:var(--panel);border:2px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:10px;display:grid;grid-template-columns:minmax(0,1fr);gap:9px}
.qrow{display:flex;gap:8px}
#qInput{flex:1;min-width:0;font:500 16px var(--f-body);padding:12px 14px;border-radius:var(--r-md);border:2px solid var(--line);background:var(--panel-2);color:var(--ink)}
#qInput::placeholder{color:var(--ink-3)}
#qInput:focus{outline:none;border-color:var(--focus)}
.btn-go{font-family:var(--f-display);font-size:18px;letter-spacing:.03em;color:var(--go-ink);background:var(--go);border:0;border-radius:var(--r-md);padding:0 20px;box-shadow:inset 0 -4px 0 var(--go-deep);text-shadow:0 1px 0 rgba(0,0,0,.25);cursor:pointer}
.btn-go:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 var(--go-deep)}
.qmeta{display:flex;align-items:center;gap:10px;min-width:0}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:600 13px var(--f-body);padding:5px 11px;border-radius:999px;border:2px solid var(--line);background:transparent;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--ink-3))}
.chip[aria-checked="true"]{border-color:var(--c,var(--ink));color:var(--ink);background:color-mix(in srgb,var(--c,var(--ink)) 13%,transparent)}
.chip .n{font-variant-numeric:tabular-nums;color:var(--ink-3);font-weight:700}
#qHint{font-size:12.5px;color:var(--ink-2);white-space:nowrap;flex:none;font-variant-numeric:tabular-nums}
#qHint b{color:var(--ink);font-weight:700}
@media (max-width:600px){.qmeta{flex-direction:column;align-items:stretch;gap:6px}#qHint{white-space:normal;min-height:1.2em}}

/* ---------- sheet ---------- */
#sheet{position:fixed;z-index:25;top:calc(env(safe-area-inset-top,0px) + 68px);right:max(16px,env(safe-area-inset-right,0px));bottom:calc(var(--qh) + 6px);
  width:min(440px,calc(100vw - 32px));background:var(--panel);border:2px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;animation:sheetIn .24s cubic-bezier(.2,1.2,.4,1)}
#sheet.wide{right:auto;left:50%;transform:translateX(-50%);width:min(760px,calc(100vw - 32px))}
@keyframes sheetIn{from{translate:0 14px;opacity:0}to{translate:0 0;opacity:1}}
@media (min-width:721px){#app.sheet-open:not(.wide-open) #stage{right:calc(min(440px,100vw - 32px) + 20px)}}
#app.wide-open #stage{filter:saturate(.75) brightness(.8)}
@media (max-width:720px){
  #sheet,#sheet.wide{top:calc(env(safe-area-inset-top,0px) + 30vh);left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));width:auto;transform:none}
  #sheet.wide{top:calc(env(safe-area-inset-top,0px) + 64px)}
}
.sh-head{display:flex;align-items:center;gap:12px;padding:14px 12px 12px 16px;border-bottom:2px solid var(--line)}
.sh-icon{flex:none;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent)}
.sh-title{font-family:var(--f-display);font-size:24px;line-height:1.05;letter-spacing:.02em}
.sh-sub{font-size:13px;color:var(--ink-2);margin-top:2px}
.icon-btn{margin-left:auto;flex:none;width:38px;height:38px;border-radius:12px;border:0;background:var(--panel-2);display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.icon-btn:hover{color:var(--ink)}
.sh-body{flex:1;min-height:0;overflow:auto;padding:12px 14px 22px;overscroll-behavior:contain}

/* lists */
ul{list-style:none;margin:0;padding:0}
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 6px}
.grp{margin-top:12px}
.grp-h{display:flex;align-items:baseline;gap:8px;font:700 11.5px var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);padding:0 6px 4px}
.grp-h.over{color:var(--alert)}
.grp-h .n{font-variant-numeric:tabular-nums}
.item{display:grid;grid-template-columns:28px minmax(0,1fr);align-items:start;gap:10px;padding:9px 8px;border-radius:12px}
.item:hover{background:var(--panel-2)}
.ck{margin-top:1px;width:24px;height:24px;border-radius:50%;border:2.5px solid var(--c);background:transparent;display:grid;place-items:center;cursor:pointer;padding:0;color:var(--c)}
.ck svg{opacity:0;transition:opacity .15s}
.ck:hover svg{opacity:.4}
.item.done .ck{background:var(--c);color:var(--panel)}
.item.done .ck svg{opacity:1}
.ttl{display:block;width:100%;background:none;border:0;text-align:left;font:500 15px/1.35 var(--f-body);color:var(--ink);cursor:pointer;padding:0;overflow-wrap:anywhere}
.item.done .ttl{text-decoration:line-through;color:var(--ink-3)}
.meta{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:5px;font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;background:var(--panel-2);font-weight:600;white-space:nowrap}
.item:hover .tag{background:var(--panel)}
.tag.over{color:var(--alert)}
.tag.ex{border:1.5px dashed var(--ink-3);background:transparent}
.cat-dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.ai{color:var(--c-idea);display:inline-flex}
.edit{background:var(--panel-2);border-radius:14px;padding:12px;margin:2px 0 8px;display:grid;gap:10px}
.edit label{font:700 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);display:grid;gap:5px}
.edit input{font:500 15px var(--f-body);padding:9px 11px;border-radius:10px;border:2px solid var(--line);background:var(--panel);color:var(--ink);min-width:0;width:100%}
.edit .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.edit .acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:2px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 13px;font-weight:700;font-size:13.5px;cursor:pointer}
.btn.primary{background:var(--go);border-color:var(--go);color:var(--go-ink);box-shadow:inset 0 -3px 0 var(--go-deep)}
.btn.danger{color:var(--alert)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn:disabled{opacity:.55;cursor:default}
.empty{padding:26px 10px;text-align:center;color:var(--ink-2);line-height:1.5}
.empty b{display:block;font-family:var(--f-display);font-weight:400;font-size:19px;color:var(--ink);margin-bottom:4px;letter-spacing:.02em}
.done-toggle{margin-top:14px;width:100%;text-align:left;border:0;background:transparent;padding:8px 6px;font:700 11.5px var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);cursor:pointer}
.banner{font-size:13px;line-height:1.45;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--c-daily) 14%,transparent);margin-bottom:8px}
.sec-h{font:700 11.5px var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin:18px 6px 8px;display:flex;gap:8px;align-items:center}
.sec-h:first-child{margin-top:4px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.day{border-radius:12px;background:var(--panel-2);padding:8px 2px;text-align:center;display:grid;gap:3px;justify-items:center}
.day.today{background:color-mix(in srgb,var(--b-cal) 16%,transparent)}
.day small{font-size:11px;font-weight:700;color:var(--ink-3);text-transform:uppercase}
.day strong{font-family:var(--f-display);font-weight:400;font-size:18px;font-variant-numeric:tabular-nums}
.dots{display:flex;gap:2px;min-height:6px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.trow{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;padding:9px 6px;border-radius:12px;align-items:baseline}
.trow time{font-weight:700;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.trow .t{overflow-wrap:anywhere}
.soon{border:2px dashed var(--line);border-radius:16px;padding:14px;margin-top:18px}
.soon h4{margin:0 0 4px;font-family:var(--f-display);font-weight:400;font-size:18px;letter-spacing:.02em}
.soon p{margin:0 0 10px;color:var(--ink-2);line-height:1.5;font-size:14px}
.ghost{opacity:.6}
.mail{border-radius:14px;background:var(--panel-2);padding:11px 12px;margin-bottom:8px}
.mail .from{font-weight:700;font-size:13.5px}
.mail .sub{font-size:14px;margin-top:2px}
.mail .why{font-size:12.5px;color:var(--ink-2);margin-top:4px}
.idea{border-radius:16px;background:var(--panel-2);padding:12px 12px 10px;margin-bottom:10px}
.idea h4{margin:0;font:600 15.5px/1.35 var(--f-body);overflow-wrap:anywhere}
.idea .when{font-size:12px;color:var(--ink-3);margin-top:3px}
.idea ol{margin:8px 0 2px;padding-left:20px;font-size:14px;line-height:1.45;color:var(--ink-2)}
.idea .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.idea .btn{padding:6px 11px;font-size:13px}
.loading{padding:30px 10px;text-align:center;color:var(--ink-2)}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(var(--qh) + 14px);translate:-50% 0;z-index:40;background:var(--ink);color:var(--panel);border-radius:14px;padding:10px 10px 10px 16px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);font-weight:600;font-size:14px;max-width:calc(100vw - 32px);animation:sheetIn .2s ease}
#toast button{border:0;background:color-mix(in srgb,var(--panel) 18%,transparent);color:var(--panel);font-weight:700;border-radius:9px;padding:6px 11px;cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<div id="app">
  <div id="world">
    <div id="stage">
      <svg id="scene" viewBox="0 0 1000 720" preserveAspectRatio="xMidYMid meet" role="group" aria-label="Your island. Each building opens a part of your organiser."></svg>
    </div>
  </div>

  <header class="hud-top">
    <div class="pill brand"><b>Xavier's Island</b><span id="today"></span></div>
    <div class="pill seg" role="group" aria-label="View">
      <button id="vIsland" aria-pressed="true">Island</button>
      <button id="vList" aria-pressed="false">List</button>
    </div>
  </header>

  <aside id="sheet" hidden aria-labelledby="shTitle"></aside>

  <form id="quick" autocomplete="off">
    <div class="qcard">
      <div class="qrow">
        <label class="sr" for="qInput">Add a to-do or idea</label>
        <input id="qInput" placeholder="Add anything… e.g. “problem sheet due fri” or “idea: solar lamp”" enterkeyhint="done">
        <button class="btn-go" type="submit">Add</button>
      </div>
      <div class="qmeta">
        <div class="chips" id="qChips" role="radiogroup" aria-label="Where it goes"></div>
        <div id="qHint" aria-live="polite"></div>
      </div>
    </div>
  </form>
  <div id="toast" hidden role="status"></div>
</div>

<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const NS = "http://www.w3.org/2000/svg";
const svg = $("#scene");
const el = (t, a = {}, p) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

/* ================= ISOMETRIC ART ================= */
const S = 48, CX = 500, CY = 390, CO = 0.8660254, SI = 0.5;
const P = (x, y, z = 0) => [CX + (x - y) * CO * S, CY + (x + y) * SI * S - z * S];
const r1 = n => Math.round(n * 10) / 10;
const pts = a => a.map(p => r1(p[0]) + "," + r1(p[1])).join(" ");
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const t = amt < 0 ? 0 : 255, k = Math.abs(amt);
  r = Math.round(r + (t - r) * k); g = Math.round(g + (t - g) * k); b = Math.round(b + (t - b) * k);
  return "#" + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
}
const poly = (p, a, fill, cls = "ol") => el("polygon", { points: pts(a), fill, class: cls }, p);
function box(p, x, y, z, w, d, h, col) {
  poly(p, [P(x, y + d, z), P(x + w, y + d, z), P(x + w, y + d, z + h), P(x, y + d, z + h)], col);
  poly(p, [P(x + w, y + d, z), P(x + w, y, z), P(x + w, y, z + h), P(x + w, y + d, z + h)], shade(col, -.2));
  poly(p, [P(x, y, z + h), P(x + w, y, z + h), P(x + w, y + d, z + h), P(x, y + d, z + h)], shade(col, .22));
}
function pyramid(p, x, y, z, w, d, h, col) {
  const A = P(x + w / 2, y + d / 2, z + h), a = P(x, y, z), b = P(x + w, y, z), c = P(x + w, y + d, z), e = P(x, y + d, z);
  poly(p, [a, e, A], shade(col, .12)); poly(p, [a, b, A], shade(col, -.1));
  poly(p, [e, c, A], col); poly(p, [c, b, A], shade(col, -.24));
}
// a group whose local units = world units on a building face; u runs left→right, v runs top→bottom
function faceG(p, side, x, y, z, w, d, h) {
  const o = side === "L" ? P(x, y + d, z + h) : P(x + w, y + d, z + h);
  const m = side === "L" ? [CO * S, SI * S, 0, S] : [CO * S, -SI * S, 0, S];
  return el("g", { transform: `matrix(${m.map(r1).join(",")},${r1(o[0])},${r1(o[1])})` }, p);
}
const faces = (geo, lit, ...a) => [faceG(geo, ...a), faceG(lit, ...a)];
function win(g, lg, u, v, w, h) {
  el("rect", { x: u, y: v, width: w, height: h, rx: .05, fill: "#79c0e8", class: "ol ol-n" }, g);
  el("rect", { x: u + .05, y: v + .05, width: w * .3, height: h - .1, fill: "#d4f0ff", opacity: .85 }, g);
  el("line", { x1: u + w / 2, y1: v, x2: u + w / 2, y2: v + h, stroke: "#2a2238", "stroke-width": 1.6, "vector-effect": "non-scaling-stroke" }, g);
  el("rect", { x: u, y: v, width: w, height: h, rx: .05, fill: "#ffd76e", filter: "url(#glow)" }, lg);
}
function smoothPath(a) {
  let d = ""; const n = a.length;

    if (i === 0) d += `M${r1(p1[0])},${r1(p1[1])}`;
    d += `C${r1(p1[0] + (p2[0] - p0[0]) / 6)},${r1(p1[1] + (p2[1] - p0[1]) / 6)} ${r1(p2[0] - (p3[0] - p1[0]) / 6)},${r1(p2[1] - (p3[1] - p1[1]) / 6)} ${r1(p2[0])},${r1(p2[1])}`;
  }
  return d + "Z";
}

  if (/^\s*idea\b\s*[:\-–]?/i.test(raw)) { kind = "idea"; s = " " + raw.replace(/^\s*idea\b\s*[:\-–]?\s*/i, "") + " "; }
  if ((m = cut(new RegExp("\\s(?:at\\s+|@\\s*)?(\\d{1,2})(?:[:.](\\d{2}))?\\s*(am|pm)" + END, "i")))) { let h = +m[1] % 12; if (m[3].toLowerCase() === "pm") h += 12; time = pad(h) + ":" + (m[2] || "00"); }

  else if ((m = cut(new RegExp(pre + "(next\\s+|this\\s+)?(monday|mon|tuesday|tues|tue|wednesday|weds|wed|thursday|thurs|thur|thu|friday|fri|saturday|sat|sunday|sun)" + END, "i")))) {
    const idx = DOWS[m[2].slice(0, 3).toLowerCase()]; let diff = (idx - today.getDay() + 7) % 7;

  else if ((m = cut(new RegExp(pre + "(\\d{1,2})(?:st|nd|rd|th)?\\s+(jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec)[a-z]*" + END, "i")))) {
    let d = new Date(today.getFullYear(), MONS.indexOf(m[2].slice(0, 3).toLowerCase()), +m[1]); if (d < today) d.setFullYear(d.getFullYear() + 1); due = isoD(d);

  return { kind, title, category, due, time };
}

    [["all", "All"], ...Object.entries(CATS)].map(([k, v]) => `<button class="chip" role="radio" data-act="filter" data-f="${k}" aria-checked="${f === k}" ${k !== "all" ? `style="--c:var(--c-${k})"` : ""}>${k !== "all" ? '<i class="dot"></i>' : ""}${v} <span class="n">${counts[k]}</span></button>`).join("") + `</div>`;
  const vis = open.filter(([, it]) => f === "all" || it.category === f).sort(sortT);
  const G = [["over", "Overdue", n => n < 0], ["today", "Today", n => n === 0], ["tom", "Tomorrow", n => n === 1], ["week", "This week", n => n > 1 && n <= 7], ["later", "Later", n => n > 7], ["none", "Anytime", null]];
  if (!vis.length) {
    h += `<div class="empty"><b>${all.length ? "All clear" : "Nothing here yet"}</b>${all.length ? "Nothing open" + (f !== "all" ? " in " + CATS[f] : "") + ". Enjoy it." : "Type in the bar below and press Enter. Try “problem sheet due fri” or “gym legs tomorrow 7am”."}</div>`;
  }
  for (const [k, label, test] of G) {
    const rows = vis.filter(([, it]) => test ? it.due && test(dayDiff(it.due)) : !it.due);
    if (!rows.length) continue;
    h += `<section class="grp"><div class="grp-h${k === "over" ? " over" : ""}">${label} <span class="n">${rows.length}</span></div><ul>${rows.map(([id, it]) => itemHTML(id, it)).join("")}</ul></section>`;
  }
  const done = all.filter(([, it]) => it.done && (f === "all" || it.category === f) && Date.now() - (it.doneAt || 0) < 7 * 864e5).sort((a, b) => (b[1].doneAt || 0) - (a[1].doneAt || 0));
  if (done.length) {
    h += `<button class="done-toggle" data-act="showdone" aria-expanded="${st.showDone}">${st.showDone ? "▾" : "▸"} Done this week · ${done.length}</button>`;
    if (st.showDone) h += `<ul>${done.map(([id, it]) => itemHTML(id, it)).join("")}</ul>`;
  }
  return h;
}
function calBody() {
  const t = midnight(); const all = todos().filter(([, it]) => !it.done && it.due);
  let h = `<h3 class="sec-h">Next 7 days</h3><div class="week">`;
  for (let i = 0; i < 7; i++) {
    const d = addDays(t, i), k = isoD(d), its = all.filter(([, it]) => it.due === k);
    h += `<div class="day${i === 0 ? " today" : ""}"><small>${d.toLocaleDateString("en-GB", { weekday: "short" })}</small><strong>${d.getDate()}</strong><span class="dots">${its.slice(0, 4).map(([, it]) => `<i style="--c:var(--c-${it.category})"></i>`).join("")}</span></div>`;
  }
  h += `</div><h3 class="sec-h">Today from your to-dos</h3>`;
  const today = all.filter(([, it]) => it.due === isoD(t)).sort(sortT);
  h += today.length ? today.map(([, it]) => `<div class="trow"><time>${it.time || "Any time"}</time><span class="t">${esc(it.title)}</span></div>`).join("") : `<div class="empty" style="padding:12px">Nothing due today.</div>`;
  h += `<div class="soon"><h4>Outlook comes next</h4><p>The next build connects your Imperial and personal Outlook calendars, plus your Outlook reminders, so your whole day shows here.</p>
    <div class="ghost"><div class="trow"><time>09:00</time><span class="t">Lecture <span class="tag ex">Example</span></span></div><div class="trow"><time>14:00</time><span class="t">Design studio <span class="tag ex">Example</span></span></div><div class="trow"><time>18:30</time><span class="t">Reminder: pack gym bag <span class="tag ex">Example</span></span></div></div></div>`;
  return h;
}
function mailBody() {
  return `<div class="soon" style="margin-top:4px"><h4>Opening soon</h4><p>The Post Office will read Gmail and Outlook each morning, pull out what needs you, and sum up everything else in a few lines. Below is how it will look.</p></div>
  <h3 class="sec-h">Needs you <span class="tag ex">Example</span></h3>
  <div class="mail ghost"><div class="from">Module leader</div><div class="sub">Coursework brief updated</div><div class="why">Deadline moved a week later. Worth checking the new marking scheme.</div></div>
  <div class="mail ghost"><div class="from">Project group</div><div class="sub">Can we meet Thursday?</div><div class="why">Asks for your availability. Needs a reply.</div></div>
  <h3 class="sec-h">Everything else <span class="tag ex">Example</span></h3>
  <p class="ghost" style="margin:0 6px;line-height:1.55;color:var(--ink-2)">6 newsletters, 2 delivery updates and a society event invite. Nothing urgent.</p>`;
}
function ideasBody() {
  const list = ideas();
  let h = st.mode === "demo" ? `<div class="banner">Preview mode. The idea below is an example.</div>` : "";
  if (!list.length) return h + `<div class="empty"><b>No ideas floating yet</b>Start a note with “idea:” or pick the Idea chip below, then press Enter.</div>`;
  return h + list.map(([id, it]) => `<article class="idea" data-id="${id}"><h4>${esc(it.title)}</h4><div class="when">${new Date(it.createdAt).toLocaleDateString("en-GB", { day: "numeric", month: "short" })}${it.example ? ' · <span class="tag ex">Example</span>' : ""}</div>
    ${Array.isArray(it.steps) && it.steps.length ? `<ol>${it.steps.map(s => `<li>${esc(s)}</li>`).join("")}</ol>` : ""}
    <div class="acts">${sample && !st.aiOff ? `<button class="btn" data-act="steps" ${st.busy.has(id) ? "disabled" : ""}>${st.busy.has(id) ? "Thinking…" : it.steps ? "New next steps" : "Next steps"}</button>` : ""}<button class="btn" data-act="totodo">Make it a to-do</button><button class="btn danger" data-act="del">Delete</button></div></article>`).join("");
}
function sheetSub(b) {
  if (b === "todo") { const n = dueNowCount(), o = todos().filter(([, it]) => !it.done).length; return `${BINFO.todo.s} · ${o} open${n ? ` · ${n} due now` : ""}`; }
  if (b === "ideas") { const n = ideas().length; return `${BINFO.ideas.s} · ${n} idea${n === 1 ? "" : "s"}`; }
  return BINFO[b].s;
}
function openPanel(b, wide = false) {
  st.panel = b; st.wide = wide; st.edit = null;
  sheet.hidden = false; sheet.classList.toggle("wide", wide);
  sheet.style.setProperty("--c", BINFO[b].c);
  sheet.innerHTML = `<div class="sh-head"><div class="sh-icon">${ICON[b]}</div><div><div class="sh-title" id="shTitle">${BINFO[b].t}</div><div class="sh-sub" id="shSub"></div></div><button class="icon-btn" data-act="close" aria-label="Close">${ICON.x}</button></div><div class="sh-body" id="shBody"></div>`;
  $("#app").classList.toggle("sheet-open", true); $("#app").classList.toggle("wide-open", wide);
  $("#vIsland").setAttribute("aria-pressed", String(!wide)); $("#vList").setAttribute("aria-pressed", String(wide));
  setChip(b === "ideas" ? "idea" : "auto");
  Object.keys(hoverables).forEach(k => setUp(k, k === b));
  renderPanel();
  try { localStorage.setItem("island.view", wide ? "list" : "island"); } catch (e) {}
}
function closePanel() {
  st.panel = null; st.edit = null; sheet.hidden = true; sheet.innerHTML = "";
  $("#app").classList.remove("sheet-open", "wide-open");
  $("#vIsland").setAttribute("aria-pressed", "true"); $("#vList").setAttribute("aria-pressed", "false");
  setChip("auto"); Object.keys(hoverables).forEach(k => setUp(k, false));
  try { localStorage.setItem("island.view", "island"); } catch (e) {}
}
function renderPanel() {
  if (!st.panel) return;
  const body = $("#shBody"); if (!body) return;
  const a = document.activeElement;
  if (a && body.contains(a) && a.tagName === "INPUT") return; // don't yank an open editor
  $("#shSub").textContent = st.mode === "loading" ? BINFO[st.panel].s : sheetSub(st.panel);
  if (st.mode === "loading" && (st.panel === "todo" || st.panel === "ideas")) { body.innerHTML = `<div class="loading">Opening your island…</div>`; return; }
  const top = body.scrollTop;
  body.innerHTML = st.panel === "todo" ? todoBody() : st.panel === "cal" ? calBody() : st.panel === "mail" ? mailBody() : ideasBody();
  body.scrollTop = top;
}

/* ================= UI: scene state ================= */
function setUp(b, on) { (hoverables[b] || []).forEach(g => g.classList.toggle("up", on)); }
function pulse(b) { (hoverables[b] || []).forEach(g => { const p = g.querySelector(".popw"); if (p) { p.classList.remove("pop"); void p.getBBox(); p.classList.add("pop"); } }); }
function setBubble(b, n) {
  const t = document.getElementById("bub-" + b); if (!t) return;
  t.textContent = n > 99 ? "99+" : String(n); t.parentNode.setAttribute("visibility", n > 0 ? "visible" : "hidden");
}
function render() {
  setBubble("todo", st.mode === "loading" ? 0 : dueNowCount());
  const ni = ideas().length;
  setBubble("ideas", st.mode === "loading" ? 0 : ni);
  const halo = $("#halo"); if (halo) halo.setAttribute("opacity", r1(Math.min(1, .25 + ni * .15)));
  const tb = document.querySelector('.bldg[data-b="todo"]'); if (tb) tb.setAttribute("aria-label", `To-dos, Town Hall. ${dueNowCount()} due now.`);
  renderPanel();
}

/* ================= UI: quick add ================= */
const qInput = $("#qInput"), qHint = $("#qHint");
const CHIPS = [["auto", "Auto", null], ["academic", "Academic", "var(--c-academic)"], ["fitness", "Fitness", "var(--c-fitness)"], ["daily", "Daily", "var(--c-daily)"], ["misc", "Misc", "var(--c-misc)"], ["idea", "Idea", "var(--c-idea)"]];
$("#qChips").innerHTML = CHIPS.map(([k, v, c]) => `<button type="button" class="chip" role="radio" data-chip="${k}" aria-checked="${k === "auto"}" ${c ? `style="--c:${c}"` : ""}>${c ? '<i class="dot"></i>' : SPARK}${v}</button>`).join("");
function setChip(k) { st.chip = k; document.querySelectorAll("#qChips .chip").forEach(b => b.setAttribute("aria-checked", String(b.dataset.chip === k))); updateHint(); }
function resolve(raw) {
  const p = parseQuick(raw); let kind = p.kind, category = p.category;
  if (st.chip === "idea") kind = "idea"; else if (st.chip !== "auto") { kind = "todo"; category = st.chip; }
  return { ...p, kind, category };
}
function updateHint() {
  const raw = qInput.value.trim();
  if (!raw) { qHint.innerHTML = st.chip === "auto" ? `Claude sorts it for you` : `Goes to <b>${st.chip === "idea" ? "Ideas" : CATS[st.chip]}</b>`; return; }
  const r = resolve(raw);
  qHint.innerHTML = `→ <b>${r.kind === "idea" ? "Ideas" : CATS[r.category]}</b>${r.kind !== "idea" && (r.due || r.time) ? " · " + esc(fmtDue(r.due, r.time)) : ""}`;
}
$("#qChips").addEventListener("click", e => { const b = e.target.closest("[data-chip]"); if (b) { setChip(b.dataset.chip); qInput.focus(); } });
qInput.addEventListener("input", updateHint);
$("#quick").addEventListener("submit", e => {
  e.preventDefault();
  const raw = qInput.value.trim(); if (!raw) { qInput.focus(); return; }
  if (st.mode === "loading") { toast("Still opening your island. Try again in a second."); return; }
  const r = resolve(raw);
  const obj = { kind: r.kind, title: r.title || raw, category: r.category, due: r.kind === "idea" ? null : r.due, time: r.kind === "idea" ? null : r.time, done: false, doneAt: null, createdAt: Date.now(), raw, manual: st.chip !== "auto", ai: false };
  const id = store.newId(); store.set(id, obj);
  qInput.value = ""; updateHint();
  toast(`Added to ${obj.kind === "idea" ? "Ideas" : CATS[obj.category]}${obj.due ? " · " + fmtDue(obj.due, obj.time) : ""}`, "Undo", () => store.remove(id));
  pulse(obj.kind === "idea" ? "ideas" : "todo");
  refine(id, obj);
});

/* ================= UI: events ================= */
let toastT;
function toast(msg, label, fn) {
  const t = $("#toast"); clearTimeout(toastT);
  t.innerHTML = `<span></span>${label ? `<button type="button">${esc(label)}</button>` : ""}`;
  t.firstChild.textContent = msg; t.hidden = false;
  if (label) t.querySelector("button").onclick = () => { t.hidden = true; fn(); };
  toastT = setTimeout(() => t.hidden = true, label ? 5000 : 3600);
}
svg.addEventListener("click", e => {
  const b = e.target.closest(".bldg"); if (b) { const k = b.dataset.b; st.panel === k && !st.wide ? closePanel() : openPanel(k); return; }
  if (e.target.closest(".plot")) toast("An empty plot. Future buildings go here, like a Library for module deadlines or an Arena for training.");
});
svg.addEventListener("keydown", e => { if (e.key !== "Enter" && e.key !== " ") return; const b = e.target.closest(".bldg"); if (b) { e.preventDefault(); openPanel(b.dataset.b); } else if (e.target.closest(".plot")) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent("click", { bubbles: true })); } });
["pointerover", "focusin"].forEach(ev => svg.addEventListener(ev, e => { const b = e.target.closest(".bldg"); if (b) setUp(b.dataset.b, true); }));
["pointerout", "focusout"].forEach(ev => svg.addEventListener(ev, e => { const b = e.target.closest(".bldg"); if (b && b.dataset.b !== st.panel && !(e.relatedTarget && b.contains(e.relatedTarget))) setUp(b.dataset.b, false); }));
$("#vIsland").onclick = () => closePanel();
$("#vList").onclick = () => openPanel("todo", true);

sheet.addEventListener("click", e => {
  const a = e.target.closest("[data-act]"); if (!a) return;
  const act = a.dataset.act, row = a.closest("[data-id]"), id = row && row.dataset.id, it = id && st.items.get(id);
  if (act === "close") return closePanel();
  if (act === "filter") { st.filter = a.dataset.f; return renderPanel(); }
  if (act === "showdone") { st.showDone = !st.showDone; return renderPanel(); }
  if (!it) return;
  if (act === "toggle") { const done = !it.done; store.update(id, { done, doneAt: done ? Date.now() : null }); if (done) { pulse("todo"); toast("Done: " + it.title, "Undo", () => store.update(id, { done: false, doneAt: null })); } }
  else if (act === "edit") { st.edit = st.edit === id ? null : id; renderPanel(); const t = $("#ed-title"); if (t) t.focus(); }
  else if (act === "setcat") { row.querySelectorAll("[data-act=setcat]").forEach(c => c.setAttribute("aria-checked", String(c === a))); row.dataset.cat = a.dataset.cat; }
  else if (act === "save") {
    const title = $("#ed-title").value.trim() || it.title;
    const patch = { title, due: $("#ed-due").value || null, time: $("#ed-time").value || null, category: row.dataset.cat || it.category, edited: true };
    st.edit = null; a.blur(); store.update(id, patch);
  }
  else if (act === "cancel") { st.edit = null; a.blur(); renderPanel(); }
  else if (act === "del") { st.edit = null; a.blur(); const copy = { ...it }; store.remove(id); toast("Deleted", "Undo", () => store.set(id, copy)); }
  else if (act === "toidea") { st.edit = null; a.blur(); store.update(id, { kind: "idea", due: null, time: null, edited: true }); toast("Moved to Ideas"); pulse("ideas"); }
  else if (act === "totodo") { store.update(id, { kind: "todo", category: it.category || "misc", edited: true }); toast("Now a to-do in the Town Hall"); pulse("todo"); }
  else if (act === "steps") ideaSteps(id);
});
sheet.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.closest(".edit input")) { e.preventDefault(); const s = sheet.querySelector("[data-act=save]"); s && s.click(); } });
document.addEventListener("keydown", e => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || "");
  if (e.key === "Escape") { if (typing) document.activeElement.blur(); else if (st.panel) closePanel(); return; }
  if (!typing && (e.key === "n" || e.key === "/") && !e.metaKey && !e.ctrlKey) { e.preventDefault(); qInput.focus(); }
});
new ResizeObserver(() => document.documentElement.style.setProperty("--qh", $("#quick").offsetHeight + "px")).observe($("#quick"));
addEventListener("resize", fitView);

/* ================= boot ================= */
drawScene(); fitView(); tickClock(); updateHint(); render();
setInterval(tickClock, 30000);
let startView = "island"; try { startView = localStorage.getItem("island.view") || "island"; } catch (e) {}
if (startView === "list") openPanel("todo", true);
initData();
})();
</script>
